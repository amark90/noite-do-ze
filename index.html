<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A Tasca do Zé: A Marosca Perpétua</title>
  <style>
    :root {
      --blue: #241910;
      --cyan: #e7c27a;
      --yellow: #f3d7a1;
      --white: #f6efe2;
      --gray: #f3e6c8;
      --dark: #8d6b45;
      --black: #2a2118;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #070707;
      color: var(--white);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    #monitor {
      width: min(1080px, 100vw);
      height: min(860px, 100vh);
      background: linear-gradient(180deg, #3a3a3a, #1b1b1b);
      padding: 16px 16px 10px;
      border-radius: 22px;
      box-shadow: 0 24px 70px #000, inset 0 0 0 2px #111;
      display: flex;
      flex-direction: column;
    }

    #crt {
      position: relative;
      flex: 1;
      min-height: 0;
      background: var(--blue);
      overflow: hidden;
      border-radius: 14px 14px 18px 18px;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.45);
    }

    #ui {
      position: relative;
      z-index: 1;
      height: 100%;
      overflow: hidden;
      padding: 8px 12px 8px;
      display: flex;
      flex-direction: column;
    }

    #scan, #glow {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 3;
    }

    #scan {
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.05) 0px,
        rgba(0, 0, 0, 0.05) 1px,
        transparent 2px,
        transparent 6px
      );
      opacity: 0.12;
      animation: flicker 4.5s infinite;
    }

    #glow {
      background:
        linear-gradient(90deg, rgba(255, 0, 70, 0.06), transparent 18%, transparent 82%, rgba(0, 255, 255, 0.07)),
        radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.45) 100%);
      mix-blend-mode: multiply;
    }

    #brand {
      text-align: center;
      color: #8d8d8d;
      font-size: 11px;
      letter-spacing: 0.14em;
      padding: 7px 0 2px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: end;
      border-bottom: 2px solid var(--white);
      padding-bottom: 4px;
      margin-bottom: 4px;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      color: var(--yellow);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    #day {
      color: var(--cyan);
      font-size: 14px;
      white-space: nowrap;
    }

    #objective {
      min-height: 1.3em;
      color: var(--yellow);
      margin: 3px 0 4px;
      font-size: 14px;
    }

    #objective.ready {
      color: #ff5555;
      animation: pulse 0.7s steps(2) infinite;
    }

    #objective {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #meters {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px 8px;
      margin-bottom: 4px;
    }

    .meter { font-size: 12px; min-width: 0; }
    .meter .k { color: var(--cyan); display: inline; white-space: nowrap; overflow: hidden; margin-right: 6px; }
    .meter .v { color: var(--white); display: inline; }

    .track {
      display: block;
      height: 8px;
      margin-top: 2px;
      background: #3a2a22;
      border: 0;
      border-radius: 99px;
      overflow: hidden;
    }

    .fill { display: block; height: 100%; width: 0; transition: width 0.35s ease; border-radius: 99px; }
    .meter.y .fill { background: #e6b84a; }
    .meter.r .fill { background: #e15d4c; }
    .meter.g .fill { background: #67b36a; }
    .meter.c .fill { background: #5eb8c9; }
    .meter.m .fill { background: #c96eb8; }

    #nav[hidden] { display: none !important; }
    #nav {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 4px;
    }

    #nav button {
      font: inherit;
      font-size: 13px;
      background: var(--gray);
      color: var(--black);
      border: 1px solid #c8ae86;
      border-radius: 8px;
      padding: 4px 8px;
      cursor: pointer;
    }

    #nav button.on { background: var(--yellow); }
    #nav button:disabled { background: var(--dark); color: #777; cursor: default; }

    #stage {
      flex: 0 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    #screen {
      position: relative;
      flex: 0 0 auto;
      height: auto;
      min-height: 0;
      background: #000;
      line-height: 0;
      border: 2px solid var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #view {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
      background: #1a120e;
      cursor: pointer;
    }

    #copy {
      flex: 0 0 auto;
      border: 2px solid var(--yellow);
      background: #2a1c14;
      border-radius: 8px;
      min-height: 0;
      max-height: 3.4em;
      overflow: hidden;
      margin-top: 6px;
      padding: 5px 8px;
    }

    #copy h2 {
      margin: 0;
      color: var(--yellow);
      font-size: 15px;
      display: inline;
    }

    #copy p { margin: 0 0 0 8px; line-height: 1.35; display: inline; }
    #copy .sub { color: var(--cyan); }
    #copy .dim { color: #cccccc; }
    #copy.more { cursor: pointer; }

    #choices {
      display: flex;
      flex-wrap: wrap;
      flex: 0 0 auto;
      gap: 6px;
      margin-top: 6px;
    }

    #choices button, #foot button {
      font: inherit;
      text-align: center;
      background: var(--gray);
      color: var(--black);
      border: 1px solid #c8ae86;
      border-radius: 8px;
      padding: 7px 8px;
      cursor: pointer;
      flex: 1 1 120px;
    }

    #choices button:hover:not(:disabled),
    #nav button:hover:not(:disabled),
    #foot button:hover {
      background: var(--yellow);
    }

    #choices button:disabled {
      background: #444;
      color: #999;
      cursor: not-allowed;
    }

    #foot button { flex: 0 0 auto; padding: 4px 8px; font-size: 13px; }

    #foot {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      flex: 0 0 auto;
      margin-top: 6px;
      color: var(--cyan);
      font-size: 13px;
    }

    #foot button { padding: 4px 8px; font-size: 13px; }

    button:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 2px;
    }

    .shake { animation: shake 0.45s linear; }

    @keyframes flicker {
      0%, 97%, 100% { opacity: 1; }
      98% { opacity: 0.82; }
      99% { opacity: 0.94; }
    }

    @keyframes pulse {
      from { opacity: 1; }
      to { opacity: 0.45; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-3px); }
      40% { transform: translateX(3px); }
      60% { transform: translateX(-2px); }
      80% { transform: translateX(2px); }
    }

    @media (max-width: 800px) {
      #monitor {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        padding: 8px 8px 6px;
      }
      #meters { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      #ui { padding: 8px 10px 12px; }
      h1 { font-size: 16px; }
      #choices button { flex: 1 1 42%; }
    }

    @media (prefers-reduced-motion: reduce) {
      #scan, #objective.ready, .shake { animation: none; }
    }
  </style>
</head>

    function bite(text) {
      const clean = String(text || "").replace(/\s+/g, " ").trim();
      let end = clean.length - 1;
      let sentences = 0;
      for (let i = 0; i < clean.length; i++) {
        if (".!?".indexOf(clean[i]) !== -1 && (i === clean.length - 1 || clean[i + 1] === " ")) {
          sentences += 1;
          end = i;
          if (sentences >= 2 || i > 90) break;
        }
      }
      const cut = clean.slice(0, end + 1);
      return cut.length > 150 ? cut.slice(0, 147).trim() + "…" : cut;
    }
    function quip(text) {
      const clean = String(text || "").replace(/\s+/g, " ").trim();
      const a = clean.indexOf("«");
      const b = clean.indexOf("»");
      if (a >= 0 && b > a) return clean.slice(a, b + 1);
      const dot = clean.search(/[.!?](\s|$)/);
      const cut = dot === -1 ? clean : clean.slice(0, dot + 1);
      return cut.length > 90 ? cut.slice(0, 87).trim() + "…" : cut;
    }

    function wrapWords(text, max) {
      const words = String(text || "").replace(/\s+/g, " ").trim().split(" ");
      const lines = [];
      let cur = "";
      words.forEach((w) => {
        if (!w) return;
        const next = cur ? cur + " " + w : w;
        if (next.length > max && cur) {
          lines.push(cur);
          cur = w;
        } else cur = next;
      });
      if (cur) lines.push(cur);
      return lines;
    }

    function normalize(data) {
      const base = freshState();
      const next = Object.assign(base, data);
      next.stock = Object.assign(freshState().stock, data.stock || {});
      next.illegal = Object.assign(freshState().illegal, data.illegal || {});
      next.stats = Object.assign(freshState().stats, data.stats || {});
      next.notebook = (data.notebook || []).map((s) => Object.assign({ worksOn: [], used: false }, s));
      next.queue = Array.isArray(data.queue) ? data.queue : [];
      next.sickRolls = Array.isArray(data.sickRolls) ? data.sickRolls : [];
      next.upgrades = Array.isArray(data.upgrades) ? data.upgrades : [];
      next.taleQuiet = !!data.taleQuiet;
      next.carry = typeof data.carry === "string" ? data.carry : null;
      next.tale = data.tale && data.tale.id ? { id: String(data.tale.id), step: Math.max(0, Math.round(Number(data.tale.step) || 0)) } : null;
      next.money = Math.max(0, Math.round(Number(next.money) || 0));
      next.debt = Math.max(0, Math.round(Number(next.debt) || 0));
      next.heat = clamp(Math.round(Number(next.heat) || 0), 0, 100);
      next.reputation = clamp(Math.round(Number(next.reputation) || 0), 0, 100);
      next.patience = clamp(Math.round(Number(next.patience) || 0), 0, 100);
      next.day = Math.max(1, Math.round(Number(next.day) || 1));
      next.objectiveIndex = Math.max(0, Math.round(Number(next.objectiveIndex) || 0));
      next.slots = Math.max(0, Math.round(Number(next.slots) || 0));
      if (!PLACES.some((p) => p.id === next.location)) next.location = "tasca";
      next.sound = data.sound !== false;
      return next;
    }

    function unlockAudio() {
      if (!state.sound) return null;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function tone(freq, when, dur, type, gain, freq2) {
      const a = unlockAudio();
      if (!a) return;
      const o = a.createOscillator();
      const g = a.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, when);
      if (freq2) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq2), when + dur);
      g.gain.setValueAtTime(gain, when);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      o.connect(g);
      g.connect(a.destination);
      o.start(when);
      o.stop(when + dur + 0.02);
    }

    function noise(dur, gain) {
      const a = unlockAudio();
      if (!a) return;
      const n = Math.max(1, Math.floor(a.sampleRate * dur));
      const buf = a.createBuffer(1, n, a.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = a.createBufferSource();
      const g = a.createGain();
      src.buffer = buf;
      g.gain.value = gain;
      src.connect(g);
      g.connect(a.destination);
      src.start();
    }

    function sfx(name) {
      if (!state.sound) return;
      const a = unlockAudio();
      if (!a) return;
      const t = a.currentTime;
      if (name === "blip") tone(660, t, 0.05, "square", 0.04);
      if (name === "coin") [880, 1175, 1568].forEach((f, i) => tone(f, t + i * 0.07, 0.08, "square", 0.04));
      if (name === "glass") tone(1480, t, 0.12, "sine", 0.05, 420);
      if (name === "register") { noise(0.12, 0.05); tone(190, t, 0.12, "square", 0.04, 80); }
      if (name === "door") tone(150, t, 0.28, "sawtooth", 0.03, 48);
      if (name === "siren") {
        tone(620, t, 0.18, "square", 0.035, 900);
        tone(900, t + 0.18, 0.18, "square", 0.035, 620);
      }
      if (name === "disaster") { tone(220, t, 0.45, "sawtooth", 0.05, 40); noise(0.4, 0.06); }
    }

    function stockBits(table, bag) {
      const bits = [];
      Object.keys(table).forEach((id) => {
        if (bag[id] > 0) bits.push(bag[id] + " " + table[id].short);
      });
      return bits;
    }

    function describe() {
      const g = goal();
      const loc = state.location;
      if (loc === "tasca") {
        const fila = state.pending ? "Tens um cliente a meio da frase." : (state.queue.length ? "Há " + state.queue.length + " almas na fila." : "A fila acabou. Até a mosca foi embora.");
        const balcao = stockBits(LEGAL, state.stock);
        const cave = stockBits(ILLEGAL, state.illegal);
        const ruins = state.upgrades.slice(-2).map((id) => RUIN[id] || "Ficou mais uma cicatriz na tasca. A aldeia aponta e depois pede imperial.");

        return {

            state.montraPartida ? "A montra está partida. A rua vê o interior e o interior vê a vergonha." : "A montra ainda segura o mundo lá fora."

        };

              : "Sem um jeitinho, a freguesia leva uma fatia todas as noites. Chamam-lhe participação. Tu chamas-lhe imposto com laço.",
            "Pedir as coisas pelo caminho direito dá reputação e muito pouco dinheiro. O caderno, se tiver um podre, abre portas que a taxa não abre.",
            "As vizinhas pagam mal pelas fofocas. Aqui elas valem uma licença. Escolhe o desperdício com juízo."
          ]
        };

      if (loc === "feira") {
        return {
          title: "Feira e mercado",
          paragraphs: [
            "Bancas, alho, um altifalante rouco e a Dona Albertina em versão ambulante. Aqui o stock é legal, o troco é certo, e o lucro é uma anedota lenta.",
            "Também se vendem fofocas às coscuvilheiras. Pagam pouco e queimam o caderno. Útil para o pão. Estúpido se ias chantagear a Junta.",
            "O presunto não é para o balcão. É para o posto, quando um cabo precisa de ficar comovido."
          ]
        };
      }
      if (loc === "matos") {
        const juros = interestDue();
        return {
          title: "Casa do Sr. Matos",
          paragraphs: [
            "Uma sala escura, um sofá claro e o Sr. Matos, que sorri com os três dentes que o negócio lhe deixou. A corrente ao pescoço podia pagar a tua dívida, e ele sabe.",
            "Deves " + euro(state.debt) + ". Se não abateres hoje, a noite leva " + euro(juros) + " de juros. Se não tiveres os juros, os capangas levam a montra.",
            state.debt > 1200
              ? "Ele fala baixo, que é pior. «Zé, eu gosto de ti. Os meus rapazes gostam menos. Regulariza isso antes que a afeição acabe.»"
              : "«Precisas de ar para respirar? Eu vendo ar. O preço é ficares mais tempo debaixo de água.»"
          ]
        };

      return {
        title: "Posto da GNR",
        paragraphs: [
          "O cabo tem uma esferográfica roída e o ar de quem já ouviu todas as versões, incluindo a verdadeira, e preferiu a que tem presunto.",
          "Calor policial e ASAE: " + state.heat + "%. Acima dos 40 a rusga deixa de ser anedota e passa a ser probabilidade.",
          "Podes tentar apagar o auto com bagaço, presunto ou notas. Podes denunciar o Belmiro, do Copo Sujo. E podes, se o caderno tiver um podre das fardas, fazer o livro fechar-se sozinho.",
          state.heat >= 40 ? "Estás a cheirar a rusga. Ou baixa isto ou dorme com a carteira noutro sítio." : "Por agora o posto está calmo. Não confundas calma com amizade."

      };

    function arrive(loc, silent) {
      state.location = loc;
      ui.visitor = null;
      if (loc === "tasca") {
        beginCab(!!silent, ui.fp && ui.fp.loc === "rua" ? "door" : "bar");
        return;
      }
      ui.scene = loc;
      ui.mode = ui.cab ? "cab" : "location";
      spawnFP(loc, "in");
      if (!silent) sfx("door");
      touch();
      render();
    }

    function showText(title, lines, choices, scene, soundName, shake) {
      ui.batch = false;
      ui.beat = 0;
      ui.mode = "result";
      ui.title = title;
      ui.lines = lines;
      ui.resultChoices = choices;
      if (scene) ui.scene = scene;
      ui.visitor = null;
      ui.shake = !!shake;
      if (soundName) sfx(soundName);
      touch();
      render();
    }

    function openOver(kind, prelude) {
      ui.batch = false;
      ui.beat = 0;
      ui.mode = "over";
      ui.over = kind;
      ui.scene = "tasca";
      ui.visitor = null;
      ui.shake = true;
      if (kind === "patience") {
        ui.title = "O Zé passou-se da cabeça";
        ui.lines = (prelude || []).concat([
          "A paciência chegou a zero. Partiste copos, um banco, o quadro do Benfica e o que restava de compostura.",
          "Acordas no centro de saúde com a cabeça a latejar e uma factura. É um game over temporário: a tasca fica de pé, tu ficas mais pobre, e amanhã há outro dia para estragar."
        ]);
        sfx("disaster");
      } else {
        ui.title = "Boicote na aldeia";
        ui.lines = (prelude || []).concat([
          "A reputação caiu a zero. Nem o primo entra. O Copo Sujo põe a música mais alto de propósito.",
          "Durante a noite a aldeia fala de ti no pretérito. De manhã reabres, mais pequeno, com metade do dinheiro e a lição mal aprendida."
        ]);
        sfx("door");
      }
      ui.resultChoices = [{
        label: kind === "patience" ? "Acordar no centro de saúde" : "Encarar a manhã do boicote",
        fn: () => recover(kind)
      }];
      touch();
      render();
    }

    function recover(kind) {
      if (kind === "patience") {
        const bill = RULES.hospital;
        if (state.money >= bill) addMoney(-bill);
        else {
          state.debt += bill - state.money;
          state.money = 0;
        }
        state.patience = 64;
        addRep(-5);
      } else {
        state.money = Math.round(state.money * 0.5);
        state.reputation = 32;
        state.patience = clamp(state.patience + 8, 0, 100);
        addHeat(-8);
      }
      state.day += 1;
      state.pending = null;
      state.queue = [];
      state.crimesToday = 0;
      state.sickRolls = [];
      state.location = "tasca";
      freshQueue();
      arrive("tasca", true);
    }

    function collapsed() {
      if (state.patience <= 0) return "patience";
      if (state.reputation <= 0) return "reputation";
      return null;
    }

    function finishCustomer(caption, soundName, actKind, dry, hot) {
      state.pending = null;
      state.stats.served += 1;
      const dead = collapsed();
      if (dead) {
        openOver(dead, [caption]);
        return;
      }
      if (ui.mode === "cab" && ui.cab) {
        sfx(soundName);
        ui.cab.flash = caption;
        ui.cab.flashT = 1.15;
        ui.cab.fill = 0;
        ui.cab.listen = 0;
        ui.cab.pour = false;
        ui.cab.listening = false;
        ui.cab.drag = null;
        ui.visitor = null;
        touch();
        render();
        return;
      }
      ui.mode = "act";
      ui.scene = "tasca";
      ui.act = { kind: actKind || "palha", t: 0, caption: caption, dry: !!dry, hot: !!hot };
      sfx(soundName);
      touch();
      render();
    }

    function endAct() {
      if (ui.mode !== "act") return;
      ui.visitor = null;
      ui.act = null;
      state.location = "tasca";
      beginCab(true);
    }

    function beginCab(silent, entry) {
      const keep = !!(ui.cab && (ui.mode === "cab" || ui.mode === "location"));
      ui.mode = "cab";
      ui.scene = "tasca";
      ui.act = null;
      if (!keep) {
        ui.cab = {
          bottle: "honesto",
          fill: 0,
          pour: false,
          listen: 0,
          listening: false,
          wait: 0,
          waitMax: 8.5,
          enter: 0,
          flash: "",
          flashT: 0,
          drag: null,
          line: "",
          brake: false,
          dwell: 0
        };
        if (!state.pending && !(state.queue && state.queue.length) && !state.lineRun) freshQueue();
        seatNext();
      }
      spawnFP("tasca", entry || "bar");
      if (!silent) sfx("door");
      touch();
      render();
    }

    function seatNext() {
      const c = ui.cab;
      if (!c) return;
      c.fill = 0;
      c.pour = false;
      c.listen = 0;
      c.listening = false;
      c.drag = null;
      c.brake = false;
      c.dwell = 0;
      c.wait = 0;
      c.enter = 0;
      if (!state.pending) {
        if (!state.queue.length) {
          ui.visitor = null;
          c.line = "";
          c.waitMax = 16;
          return;
        }
        state.pending = state.queue.shift();
        if (state.pending === "albertina") state.tutorialDone = true;
      }
      const person = personById(state.pending);
      ui.visitor = person ? person.sprite : null;
      c.line = person ? quip(person.enter[state.day % person.enter.length]) : "";
      c.waitMax = person && person.id === "albertina" && state.day === 1 ? 22 : 16;
    }

    function cabServe(fill) {
      const person = personById(state.pending);
      const c = ui.cab;
      if (!person || !c || c.flashT > 0) return;
      c.pour = false;
      const over = fill > 0.9;
      const good = fill >= 0.72 && fill <= 0.9;
      const scale = over ? 0 : good ? 1 : 0.45;
      if (c.bottle === "golpe") {
        const itemId = consumeIllegal();
        if (!itemId) {
          popup("CAVE VAZIA", "#ff5555");
          c.fill = 0;
          c.bottle = "honesto";
          sfx("glass");
          return;
        }
        const item = ILLEGAL[itemId];
        const tip = Math.floor(state.reputation / 40);
        const bonus = person.id === "beto" || person.id === "cripto" ? 6 : 0;
        let heat = item.heat;
        if (person.id === "fiscal") heat += 18;
        state.crimesToday += 1;
        if (over) {
          addHeat(Math.max(2, Math.round(heat * 0.6)));
          addRep(-6);
          finishCustomer("Entornou.", "glass", "marosca", false, true);
          return;
        }
        addMoney(Math.max(1, Math.round((item.sell + tip + bonus) * scale)));
        addHeat(heat);
        if (!good) addRep(-3);
        state.stats.maroscas += 1;
        state.sickRolls.push({ who: person.name, weight: item.sick * (good ? 1 : 0.6) });
        finishCustomer(person.id === "fiscal" ? "Ele cheirou o golpe." : (good ? "Bebeu." : "Meio copo."), "coin", "marosca", false, person.id === "fiscal");
        return;
      }
      const itemId = consumeLegal();
      const tip = Math.floor(state.reputation / 40);
      if (!itemId) {
        addRep(-4);
        finishCustomer("Só saiu água.", "glass", "palha", true);
        return;
      }
      if (over) {
        addRep(-5);
        finishCustomer("Entornou.", "glass", "palha", true);
        return;
      }
      if (person.id === "presidente" && good) addRep(2);
      if (person.id === "manel" && good) addPat(4);
      if (person.id === "fiscal" && good) addHeat(-2);
      if (!good) addRep(-2);
      addMoney(Math.max(1, Math.round((LEGAL[itemId].sell + tip) * scale)));
      finishCustomer(good ? "Certo." : "Cedo.", "register", "palha");
    }

    function releasePour() {
      if (!ui.cab) return;
      ui.cab.pour = false;
    }

    function cabMiss() {
      if (!state.pending || !ui.cab || ui.cab.flashT > 0) return;
      addRep(-6);
      addPat(-3);
      state.pending = null;
      ui.visitor = null;
      ui.cab.pour = false;
      ui.cab.listening = false;
      ui.cab.fill = 0;
      ui.cab.flash = "Foi-se. E ainda levou a conversa.";
      ui.cab.flashT = 1.15;
      sfx("door");
      const dead = collapsed();
      if (dead) {
        openOver(dead, ["Perdeu o horário."]);
        return;
      }
      touch();
      render();
    }

    function tickCab(dt) {
      const c = ui.cab;
      if (!c || ui.mode !== "cab") return;
      if (c.flashT > 0) {
        c.flashT -= dt;
        if (c.flashT <= 0) {
          c.flash = "";
          c.flashT = 0;
          seatNext();
          render();
        }
        return;
      }
      c.enter = Math.min(1, (c.enter || 0) + dt * 2.4);
      if (!state.pending) return;
      if (atBar()) c.wait += dt;
      if (!atBar()) {
        c.pour = false;
        c.brake = false;
        c.dwell = 0;
        c.listening = false;
      } else if (c.brake) {
        c.fill = Math.max(0, c.fill - dt * 0.46);
        c.pour = false;
        c.dwell = 0;
      } else if (c.pour) {
        c.fill = Math.min(1.18, c.fill + dt * 0.16);
        c.dwell = 0;
      } else if (!c.listening) {
        const early = c.fill >= 0.5 && c.fill < 0.72;
        const zone = c.fill >= 0.72 && c.fill <= 0.9;
        if (early || zone) {
          c.dwell = (c.dwell || 0) + dt;
          if (c.dwell >= (zone ? 0.34 : 0.72)) cabServe(c.fill);
        } else c.dwell = 0;
      } else c.dwell = 0;
      if (c.flashT > 0) return;
      if (c.listening) {
        c.listen = Math.min(1.2, (c.listen || 0) + dt / 1.35);
        if (c.listen >= 1) {
          c.listening = false;
          c.listen = 0;
          const person = personById(state.pending);
          if (person) doListen(person);
        }
      } else {
        c.listen = Math.max(0, (c.listen || 0) - dt / 0.4);
      }
      if (c.flashT > 0) return;
      if (c.wait >= c.waitMax) cabMiss();
    }

    function cabText(g, text, x, y, size, color, align) {
      g.fillStyle = color || "#f6efe4";
      g.font = "600 " + size + "px Avenir Next, Segoe UI, sans-serif";
      g.textAlign = align || "left";
      g.textBaseline = "top";
      g.fillText(text, x, y);
    }

    function cabDown(point) {
      const c = ui.cab;
      if (!c || ui.mode !== "cab" || c.flashT > 0) return;
      if (point.x >= 286 && point.y <= 24) {
        endDay();
        return;
      }
      if (point.x >= 278 && point.y >= 26 && point.y <= 120) {
        const atDoor = personById(state.pending);
        if (atDoor) doKick(atDoor);
        else endDay();
        return;
      }
      if (point.x <= 40 && point.y >= 30 && point.y <= 112) {
        openStreet();
        return;
      }
      if (point.x >= 64 && point.x <= 104 && point.y >= 118) {
        c.bottle = "honesto";
        sfx("blip");
        return;
      }
      if (point.x >= 214 && point.x <= 258 && point.y >= 118) {
        if (!peekIllegal()) {
          popup("CAVE VAZIA", "#ff5555");
          sfx("glass");
          return;
        }
        c.bottle = "golpe";
        sfx("blip");
        return;
      }
      const person = personById(state.pending);
      const secret = person ? secretsForPerson(person)[0] : null;
      if (secret && point.x >= 28 && point.x <= 58 && point.y >= 122 && point.y <= 156) {
        doBlackmail(person, secret);
        return;
      }
      if (person && point.x > 96 && point.x < 224 && point.y < 76) {
        c.listening = true;
        c.pour = false;
        return;
      }
      if (person && point.x > 96 && point.x < 224 && point.y < 116) {
        c.drag = point.x;
        return;
      }
      if (person && point.y >= 158) {
        c.brake = true;
        c.brakePointer = true;
        c.pour = false;
        return;
      }
      if (person) {
        c.pour = true;
        c.brake = false;
      }
    }

    function drawCab(g) {
      const c = ui.cab || { fill: 0, wait: 0, waitMax: 8.5, bottle: "honesto", line: "", enter: 1 };
      const person = personById(state.pending);
      const fill = c.fill || 0;
      const inZone = fill >= 0.72 && fill <= 0.9;
      const over = fill > 0.9;
      const q = (state.queue || []).length;

      const wall = g.createLinearGradient(0, 0, 0, 120);
      wall.addColorStop(0, "#7a5340");
      wall.addColorStop(0.45, "#5a3a2a");
      wall.addColorStop(1, "#3c261c");
      g.fillStyle = wall;
      g.fillRect(0, 0, 320, 120);
      g.fillStyle = "#4a3024";
      g.fillRect(0, 0, 320, 10);
      g.fillStyle = "#2a1a12";
      g.fillRect(0, 8, 320, 3);

      const glow = g.createRadialGradient(168, 58, 8, 168, 78, 92);
      glow.addColorStop(0, "rgba(255, 214, 150, 0.55)");
      glow.addColorStop(0.45, "rgba(255, 176, 90, 0.16)");
      glow.addColorStop(1, "rgba(255, 160, 70, 0)");
      g.fillStyle = glow;
      g.fillRect(70, 10, 190, 110);

      g.strokeStyle = "#c9a36a";
      g.lineWidth = 1.2;
      g.beginPath();
      g.moveTo(168, 10);

    function openCustomer() {
      if (!state.pending) {
        if (!state.queue.length) return;
        state.pending = state.queue.shift();
        if (state.pending === "albertina") state.tutorialDone = true;
      }
      const person = personById(state.pending);
      if (!person) {
        state.pending = null;
        render();
        return;
      }
      ui.mode = "talk";
      ui.scene = "tasca";
      ui.visitor = person.sprite;
      ui.arrive = 0;
      sfx("glass");
      touch();
      render();
    }

    function doListen(person) {
      addPat(-RULES.listenPat);
      const fresh = learnGossip(person.gossip);
      if (fresh) popup("CADERNO", "#ff55ff");
      finishCustomer(fresh ? "Ficou no caderno." : "Essa já a tinhas.", "blip", "ouvir");
    }

    function doPalha(person) {
      const itemId = consumeLegal();
      const tip = Math.floor(state.reputation / 40);
      let pay = 1 + tip;
      if (!itemId) addRep(-4);
      else {
        pay = LEGAL[itemId].sell + tip;
        if (person.id === "presidente") addRep(2);
        if (person.id === "manel") addPat(4);
      }
      addMoney(pay);
      if (person.id === "fiscal") addHeat(-2);
      finishCustomer(itemId ? "Copo e acabou-se." : "Só saiu água.", itemId ? "register" : "glass", "palha", !itemId);
    }

    function doMarosca(person) {
      const itemId = consumeIllegal();
      if (!itemId) return;
      const item = ILLEGAL[itemId];
      const tip = Math.floor(state.reputation / 40);
      const pay = item.sell + tip + (person.id === "beto" || person.id === "cripto" ? 6 : 0);
      let heat = item.heat;
      if (person.id === "fiscal") heat += 18;
      addMoney(pay);
      addHeat(heat);
      state.crimesToday += 1;
      state.stats.maroscas += 1;
      state.sickRolls.push({ who: person.name, weight: item.sick });
      finishCustomer(person.id === "fiscal" ? "Ele cheirou o golpe." : "Bebeu. Vai doer.", "coin", "marosca", false, person.id === "fiscal");
    }

    function doKick(person) {
      addPat(person.id === "manel" ? 8 : RULES.kickPat);
      addRep(person.id === "presidente" || person.id === "padre" ? -12 : RULES.kickRep);
      if (person.id === "fiscal") addHeat(12);
      if (person.id === "presidente") addHeat(6);
      state.stats.kicks += 1;
      finishCustomer("Porta.", "door", "rua");
    }

    function doBlackmail(person, secret) {
      secret.used = true;
      popup(secret.title, "#ff55ff");
      if (person.id === "presidente") {
        addMoney(70);
        addRep(-3);
        addHeat(-4);
      } else if (person.id === "fiscal") {
        addHeat(-24);
        state.sickRolls = state.sickRolls.filter((s) => s.who !== person.name);
      } else {
        addMoney(30);
      }
      finishCustomer("O caderno fala.", person.id === "fiscal" ? "blip" : "coin", "caderno");
    }

    function buyLegal(id) {
      const item = LEGAL[id];
      if (state.money < item.buy) return;
      addMoney(-item.buy);
      state.stock[id] += item.pack;
      popup("+" + item.pack, "#55ffff");
      glance("coin");
    }

    function buyIllegal(id) {
      const item = ILLEGAL[id];
      if (state.money < item.buy) return;
      addMoney(-item.buy);
      state.illegal[id] += item.pack;
      popup("+" + item.pack + " CAVE", "#55ff55");
      glance("coin");
    }

    function buySlot() {
      if (state.money < SLOT.buy) return;
      addMoney(-SLOT.buy);
      state.slots += 1;
      popup("SLOT", "#ff55ff");
      glance("register");
    }

    function bribeMayor() {
      if (state.money < RULES.bribeCost) return;
      addMoney(-RULES.bribeCost);
      addHeat(-10);
      state.bribeDays += RULES.bribeDays;
      popup(state.bribeDays + " NOITES", "#55ff55");
      glance("coin");
    }

    function honestLicense() {
      if (state.money < RULES.licenseCost) return;
      addMoney(-RULES.licenseCost);
      addRep(4);
      addHeat(-3);
      popup("CARIMBO", "#55ffff");
      glance("register");
    }

    function useAtJunta(secret) {
      secret.used = true;
      state.bribeDays += 5;
      addHeat(-8);
      addRep(-2);
      popup("SEM TAXA", "#ff55ff");
      glance("blip");
    }

    function sellSecret(secret) {
      secret.used = true;
      addMoney(RULES.gossipPrice);
      addRep(-3);
      popup("SEGREDO", "#ff55ff");
      glance("coin");
    }

    function borrow(deal) {
      addMoney(deal.cash);
      state.debt += deal.debt;
      popup("DÍVIDA +" + deal.debt, "#ff5555");
      glance("coin");
    }

    function payDebt(amount) {
      const pay = Math.min(amount, state.debt, state.money);
      if (pay <= 0) return;
      addMoney(-pay);
      state.debt -= pay;
      popup(state.debt > 0 ? "AINDA DEVE" : "LIVRE", state.debt > 0 ? "#ff5555" : "#55ff55");
      glance("register");
    }

    function bribeGnr(kind) {
      if (kind === "presunto") {
        if (state.stock.presunto <= 0) return;
        state.stock.presunto -= 1;
        addHeat(-22);
        popup("PRESUNTO", "#ffff55");
      } else if (kind === "bagaco") {
        if (state.stock.bagaco <= 0) return;
        state.stock.bagaco -= 1;
        addHeat(-14);
        popup("BAGAÇO", "#ffff55");
      } else {
        if (state.money < RULES.gnrCash) return;
        addMoney(-RULES.gnrCash);
        addHeat(-18);
        popup("NOTAS", "#ffff55");
      }
      glance("blip");
    }

    function denounce() {
      addHeat(-8);
      addRep(-6);
      addMoney(20);
      if (Math.random() < 0.35) {
        addHeat(24);
        popup("CORREU MAL", "#ff5555");
      } else {
        popup("DENÚNCIA", "#55ffff");
      }
      glance("blip");
    }

    function useAtGnr(secret) {
      secret.used = true;
      addHeat(-35);
      state.sickRolls = [];
      popup("LIVRO FECHADO", "#55ff55");
      glance("blip");
    }

    function endDay() {
      ui.batch = true;
      const lines = [];
      const before = state.money;
      if (state.pending) {
        addRep(-2);
        lines.push("Deixaste um cliente a meio da frase. Ele foi terminá-la ao Copo Sujo.");
        state.pending = null;
      }
      if (state.queue.length) {
        const n = state.queue.length;
        addRep(-Math.min(6, n));
        lines.push("Fechaste com " + (n === 1 ? "uma pessoa" : n + " pessoas") + " ainda à porta. A fila tem orgulho.");
        state.queue = [];
      }

      if (state.slots > 0) {
        const gain = SLOT.income * state.slots;
        addMoney(gain);
        addHeat(SLOT.heat * state.slots);
        lines.push("As slots tossiram " + euro(gain) + " e deixaram o calor mais gordo.");
      }

      if (state.bribeDays > 0) {
        state.bribeDays -= 1;
        lines.push("A Junta fez vista grossa esta noite. O Hilário anda distraído com o carro da Câmara.");
      } else if (state.money > 0) {
        const tax = Math.round(state.money * RULES.tax);
        if (tax > 0) {
          addMoney(-tax);
          lines.push("Contribuição voluntária da freguesia: " + euro(tax) + ". O voluntariado foi deles.");
        }
      }

      if (state.debt > 0) {
        const juros = interestDue();
        if (state.money >= juros) {
          addMoney(-juros);
          lines.push("O Sr. Matos levou " + euro(juros) + " de juros. Sorriu com os três dentes todos.");
        } else {
          const emFalta = juros - state.money;
          state.money = 0;
          state.debt += emFalta;
          addRep(-14);
          addPat(-18);
          state.montraPartida = true;
          lines.push("Não tinhas para os juros. Os capangas partiram a montra e escreveram o resto na dívida: mais " + euro(emFalta) + ".");
        }
      }

      const ultima = lines.length ? lines[lines.length - 1] : "";
      if (state.montraPartida && ultima.indexOf("partiram a montra") === -1) {
        if (state.money >= 40) {
          addMoney(-40);
          state.montraPartida = false;
          lines.push("Pagaste 40 € ao vidraceiro. Ele disse que isto é recorrente, como quem diagnostica um casamento.");
        } else {
          addRep(-3);
          lines.push("A montra continua aberta ao público e aos pardais. A reputação sente a corrente de ar.");
        }
      }

      let soundName = "door";
      let shake = false;
      const g = goal();
      if (state.money >= g.cost) {
        const kept = Math.max(15, Math.round(state.money * 0.12));
        const lost = state.money - kept;
        state.money = kept;
        state.upgrades.push(g.id);
        state.objectiveIndex += 1;
        state.disasters += 1;
        addHeat(15);
        state.sickRolls = [];
        shake = true;
        soundName = "disaster";
        lines.push(g.disaster);
        lines.push("O objectivo «" + g.title + "» durou o tempo de um brinde. " + euro(lost) + " desapareceram em estuque, advogados e vergonha.");
        const nxt = goal();
        lines.push("Novo objectivo, porque isto não acaba: " + nxt.title + " (" + euro(nxt.cost) + ").");
      } else {
        if (state.heat >= 40 && Math.random() * 100 < (state.heat - 30)) {
          const lost = Math.round(state.money * 0.8);
          addMoney(-lost);
          state.stats.raids += 1;
          const taken = seizeGoods();
          addHeat(-30);
          soundName = "siren";
          shake = true;
          lines.push("Rusga. A ASAE entrou como se o tasco fosse um cofre. Levaram " + euro(lost) + " (80% da carteira) e " + taken + ".");
        }
        const peso = state.sickRolls.reduce((sum, s) => sum + s.weight, 0);
        if (peso > 0 && Math.random() < Math.min(0.72, 0.22 * peso)) {
          const fine = 70 + Math.round(40 * state.sickRolls.length);
          const antes = state.money;
          addMoney(-fine);
          const pago = antes - state.money;
          addRep(-8);
          addHeat(8);
          const who = state.sickRolls[0].who;
          lines.push(who + " foi parar ao hospital. O juiz chamou ao petisco «experiência não autorizada». Indemnização: " + euro(pago) + (pago < fine ? " (o resto ficou no ar, mas a fama pagou)" : "") + ".");
          if (soundName !== "siren") soundName = "disaster";
        }
        state.sickRolls = [];
      }

      let cool = 5;
      if (state.slots > 0) cool = 2;
      if (state.crimesToday > 0) cool = 0;
      addHeat(-cool);
      state.crimesToday = 0;

      const after = state.money;
      if (after >= before) lines.push("Deitaste-te com mais " + euro(after - before) + " do que tinhas ao fechar a porta.");
      else lines.push("A noite levou " + euro(before - after) + ". O travesseiro não dá troco.");

      const kind = collapsed();
      if (kind) {
        openOver(kind, lines);
        return;
      }

      const caso = currentTale();
      if (caso && state.tale && state.tale.step < caso.steps.length) {
        addRep(-6);
        addPat(-4);
        if (caso.ignoreHeat) addHeat(caso.ignoreHeat);
        if (caso.ignoreDebt) state.debt += caso.ignoreDebt;
        lines.push(caso.ignore);
      }
      state.tale = null;
      state.carry = null;
      state.taleQuiet = false;
      state.day += 1;
      freshQueue();
      const nxt = goal();
      lines.push("Amanhece o dia " + state.day + ". Continuas atrás de «" + nxt.title + "», que custa " + euro(nxt.cost) + ".");
      showText("Fechou-se a porta", lines, [{
        label: "Abrir a tasca outra vez",
        fn: () => arrive("tasca", true)
      }], "tasca", soundName, shake);
    }

    function seizeGoods() {
      if (state.slots > 0) {
        state.slots -= 1;
        return "uma slot, que foi para análise e não volta";
      }
      for (const id of ["carne", "vinho", "cigarros"]) {
        if (state.illegal[id] > 0) {
          const n = state.illegal[id];
          state.illegal[id] = 0;
          return "o stock de " + ILLEGAL[id].name.toLowerCase() + " (" + n + ")";
        }
      }
      if (state.stock.vinho > 0 || state.stock.bagaco > 0) {
        state.stock.vinho = 0;
        state.stock.bagaco = 0;
        return "o que havia de mais honesto, por engano, incluindo o bagaço";
      }
      return "um queijo que não tinha culpa de nada";
    }

    function talkChoices() {
      const person = personById(state.pending);
      if (!person) return [{ label: "Voltar", fn: () => arrive("tasca", true) }];
      const illegal = peekIllegal();
      const choices = [
        { label: "Ouvir", hint: "−" + RULES.listenPat + " calma. Pode sair fofoca.", fn: () => doListen(person) },
        { label: "Palha", hint: "Copo rápido. Sem stock, a fama desce.", fn: () => doPalha(person) },
        {
          label: "Marosca",
          hint: illegal ? "+" + euro(ILLEGAL[illegal].sell) + " e sobe o calor." : "A cave está limpa.",
          disabled: !illegal,
          fn: () => doMarosca(person)
        },
        { label: "Pôr na rua", hint: "Ganhas calma. Perdes fama.", fn: () => doKick(person) }
      ];
      secretsForPerson(person).forEach((secret) => {
        choices.push({
          label: "Caderno",
          hint: "Gasta esta página do caderno. Não dá para a usares outra vez.",
          fn: () => doBlackmail(person, secret)
        });
      });
      return choices;
    }

    function locationChoices() {
      const poor = "Não tens dinheiro para isto.";
      if (state.location === "tasca") {
        const fila = state.pending ? "A meio da conversa" : (state.queue.length ? state.queue.length + " na fila" : "A fila acabou.");
        return [
          {
            label: state.pending ? "Voltar" : "Atender",
            hint: fila,
            disabled: !state.pending && state.queue.length === 0,
            fn: openCustomer
          },
          {
            label: "Dormir",
            hint: "Fecha o dia.",
            fn: endDay
          }
        ];
      }
      if (state.location === "garagem") {
        const items = Object.keys(ILLEGAL).map((id) => {
          const item = ILLEGAL[id];
          return {
            label: ({ vinho: "Vinho batizado", cigarros: "Cigarros", carne: "Carne" }[id] || item.name) + " (" + euro(item.buy) + ")",
            hint: item.pack + " doses. Venda a " + euro(item.sell) + ". Calor +" + item.heat + " por dose.",
            disabled: state.money < item.buy,
            fn: () => buyIllegal(id)
          };
        });
        items.push({
          label: "Slots (" + euro(SLOT.buy) + ")",
          hint: "+" + euro(SLOT.income) + " por noite e calor +" + SLOT.heat + ". A ASAE ouve o tilintar.",
          disabled: state.money < SLOT.buy,
          fn: buySlot
        });
        return items;
      }
      if (state.location === "junta") {
        const list = [
          {
            label: "Subornar o Presidente (" + euro(RULES.bribeCost) + ")",
            hint: "Baixa o calor e suspende a contribuição por " + RULES.bribeDays + " noites.",
            disabled: state.money < RULES.bribeCost,
            fn: bribeMayor
          },
          {
            label: "Pedir licença pelo caminho direito (" + euro(RULES.licenseCost) + ")",
            hint: "Sobe um pouco a reputação. Não chega para o objectivo.",
            disabled: state.money < RULES.licenseCost,
            fn: honestLicense
          }
        ];
        unusedSecrets("junta").forEach((secret) => {
          list.push({
            label: "Chantagear a Junta: " + secret.title,
            hint: "Sem taxa. Suspende a contribuição e baixa o calor. A página gasta-se.",
            fn: () => useAtJunta(secret)
          });
        });
        if (!list[0].disabled) list[0].hint += "";
        else if (state.money < RULES.bribeCost) list[0].hint = poor;
        return list;
      }
      if (state.location === "feira") {
        const list = Object.keys(LEGAL).map((id) => {
          const item = LEGAL[id];
          return {
            label: ({ imperial: "Imperiais", bagaco: "Bagaço", tremocos: "Tremoços", vinho: "Vinho", presunto: "Presunto" }[id] || item.name) + " (" + euro(item.buy) + ")",
            hint: item.short === "presuntos" ? "Não se bebe. Serve para comover a GNR." : "Traz " + item.pack + " para o balcão. Cada dose vende-se a " + euro(item.sell) + ".",
            disabled: state.money < item.buy,
            fn: () => buyLegal(id)
          };
        });
        unusedSecrets().forEach((secret) => {
          list.push({
            label: "Vender fofoca: " + secret.title,
            hint: euro(RULES.gossipPrice) + ". Queima a página. A Junta pagava melhor em medo.",
            fn: () => sellSecret(secret)
          });
        });
        return list;
      }
      if (state.location === "matos") {
        const loans = [
          { cash: 200, debt: 270 },
          { cash: 500, debt: 720 },
          { cash: 1000, debt: 1550 }
        ].map((deal) => ({
          label: "Pedir " + euro(deal.cash) + " emprestados",
          hint: "A dívida sobe " + euro(deal.debt) + ". Os juros de amanhã sobem com ela.",
          fn: () => borrow(deal)
        }));
        loans.push({
          label: "Amortizar 100 €",
          hint: state.debt <= 0 ? "Não deves nada. Aproveita a sensação." : "Paga até 100 €, ou o que a carteira deixar.",
          disabled: state.debt <= 0 || state.money <= 0,
          fn: () => payDebt(100)
        });
        loans.push({
          label: "Pagar a dívida toda",
          hint: state.debt <= 0 ? "Estás quite." : "Custa " + euro(state.debt) + ".",
          disabled: state.debt <= 0 || state.money < state.debt,
          fn: () => payDebt(state.debt)
        });
        return loans;
      }
      const list = [
        {
          label: "Oferecer presunto",
          hint: state.stock.presunto > 0 ? "Calor −22. Tens " + state.stock.presunto + "." : "Não tens presunto. A feira tem.",
          disabled: state.stock.presunto <= 0,
          fn: () => bribeGnr("presunto")
        },
        {
          label: "Oferecer bagaço",
          hint: state.stock.bagaco > 0 ? "Calor −14. Tens " + state.stock.bagaco + "." : "O garrafão está vazio.",
          disabled: state.stock.bagaco <= 0,
          fn: () => bribeGnr("bagaco")
        },
        {
          label: "Subornar em dinheiro (" + euro(RULES.gnrCash) + ")",
          hint: "Calor −18.",
          disabled: state.money < RULES.gnrCash,
          fn: () => bribeGnr("dinheiro")
        },
        {
          label: "Denunciar o Copo Sujo",
          hint: "Umas notas, menos calor, menos fama. Às vezes corre ao contrário.",
          fn: denounce
        }
      ];
      unusedSecrets("gnr").forEach((secret) => {
        list.push({
          label: "Usar o caderno: " + secret.title,
          hint: "Apaga bastante calor e um susto de hospital. Gasta a página.",
          fn: () => useAtGnr(secret)
        });
      });
      return list;
    }

    function notebookChoices() {
      const alive = state.notebook.filter((s) => !s.used);
      const list = [];
      if (alive.length > 1) list.push({ label: "Outra página", fn: () => { ui.note = (ui.note || 0) + 1; sfx("blip"); render(); } });
      list.push({ label: "Fechar", fn: () => arrive(state.location, true) });
      list.push({ label: "Novo jogo", fn: confirmNew });
      return list;
    }

    function titleChoices() {
      const save = peekSave();
      return [
        {
          label: "Novo jogo",
          hint: save ? "Apaga a gravação deste browser." : "O Zé ainda acha que o bilhar é uma questão de esforço.",
          fn: () => (save ? confirmNew() : startNew())
        },
        {
          label: "Continuar",
          hint: save ? "Dia " + save.day + ", " + euro(save.money) + " na carteira, dívida " + euro(save.debt) + "." : "Não há gravação neste browser.",
          disabled: !save,
          fn: continueGame
        }
      ];
    }

    function moreBeats() {
      const lines = ui.lines || [];
      return (ui.mode === "result" || ui.mode === "over" || ui.mode === "confirm") && (ui.beat || 0) < lines.length - 1;
    }

    function nextBeat() {
      ui.beat = (ui.beat || 0) + 1;
      sfx("blip");
      render();
    }

    function currentChoices() {
      if (ui.mode === "cab" || ui.mode === "act") return [];
      if (moreBeats()) return [{ label: "Seguinte", fn: nextBeat }];
      if (ui.mode === "title") return titleChoices();
      if (ui.mode === "result" || ui.mode === "over" || ui.mode === "confirm") return ui.resultChoices || [];
      if (ui.mode === "talk") return talkChoices();
      if (ui.mode === "notebook") return notebookChoices();
      if (ui.scene === "rua") return [];
      return locationChoices();
    }

    function blurb() {
      const loc = state.location;
      if (loc === "tasca") {
        const n = (state.queue || []).length;
        return { title: "O Pica-Pau", line: n || state.pending ? "Anda até ao cliente. Copo, garrafa ou porta fazem o resto." : "A tasca sossegou. A porta fecha o dia." };
      }
      if (loc === "garagem") return { title: "Zequinha", line: "Clica na mercadoria. Sem factura." };
      if (loc === "junta") return { title: "Junta", line: state.bribeDays > 0 ? "Distraídos por " + state.bribeDays + " noites." : "Suborno, papel ou caderno." };
      if (loc === "feira") return { title: "Feira", line: "Compras legais. Fofoca, se a quiseres queimar." };
      if (loc === "matos") return { title: "Sr. Matos", line: "Deves " + euro(state.debt) + ". Juros: " + euro(interestDue()) + "." };
      return { title: "GNR", line: "Calor " + state.heat + "%. Presunto ou caderno." };
    }

    function renderCopy() {
      const copy = document.getElementById("copy");
      if (copy) copy.classList.toggle("more", moreBeats());
      if (ui.fp && (ui.mode === "cab" || ui.mode === "location") && !atBar()) {
        const names = { rua: "Aldeia", tasca: "O Pica-Pau", garagem: "Zequinha", junta: "Junta", feira: "Feira", matos: "Sr. Matos", gnr: "GNR" };
        const caso = currentTale();
        return "<h2>" + (caso ? caso.title : (names[ui.fp.loc] || "Aldeia")) + "</h2><p>" + storyLine() + "</p>";
      }
      if (ui.mode === "cab" && ui.cab) {
        const person = personById(state.pending);
        const said = ui.cab.flash || (person ? ui.cab.line : (storyLine() || (state.lineRun ? "Fim de linha. A rua ainda tem um caso." : "A linha abre.")));
        return "<h2>" + (person ? person.name : "Turno") + "</h2><p>" + said + "</p>";
      }
      if (ui.mode === "title") return "<h2>A TASCA DO ZÉ</h2><p>Clica na porta.</p>";
      if (ui.scene === "rua" && ui.mode === "location") return "<h2>Aldeia</h2><p>A aldeia.</p>";
      if (ui.mode === "notebook") {
        const alive = state.notebook.filter((s) => !s.used);
        if (!alive.length) return "<h2>Caderno</h2><p>Vazio. Ouve um cliente até ao fim.</p>";
        const secret = alive[(ui.note || 0) % alive.length];
        return "<h2>" + secret.title + "</h2><p>" + bite(secret.text) + "</p>";
      }
      if (ui.mode === "act" && ui.act) return "<h2> </h2><p>" + ui.act.caption + "</p>";
      if (ui.mode === "talk") {
        const person = personById(state.pending);
        if (!person) return "<h2>…</h2><p>A cadeira ficou vazia.</p>";
        return "<h2>" + person.name + "</h2><p>" + quip(person.enter[state.day % person.enter.length]) + "</p>";
      }
      if (ui.mode === "result" || ui.mode === "over" || ui.mode === "confirm") {
        const lines = ui.lines || [""];
        const i = Math.min(ui.beat || 0, lines.length - 1);
        return "<h2>" + (ui.title || "") + "</h2><p>" + bite(lines[i]) + (moreBeats() ? " ▾" : "") + "</p>";
      }
      const info = blurb();
      return "<h2>" + info.title + "</h2><p>" + info.line + "</p>";
    }

    function renderMeters() {
      const g = goal();
      const rows = [
        ["money", "Carteira", euro(state.money), (state.money / g.cost) * 100, "y"],
        ["heat", "Calor ASAE", state.heat + "%", state.heat, "r"],
        ["rep", "Reputação", state.reputation + "%", state.reputation, "g"],
        ["pat", "Paciência", state.patience + "%", state.patience, "c"],
        ["debt", "Dívida Matos", euro(state.debt), (state.debt / 2000) * 100, "m"]
      ];
      document.getElementById("meters").innerHTML = rows.map((r) =>
        "<div class=\"meter " + r[4] + "\"><span class=\"k\">" + r[1] + "</span><span class=\"v\" id=\"m-" + r[0] + "\">" + r[2] + "</span><span class=\"track\"><span class=\"fill\" style=\"width:" +
        clamp(r[3], 0, 100) + "%\"></span></span></div>"
      ).join("");
    }

    function renderNav() {
      const locked = ui.mode !== "location" && ui.mode !== "notebook" && ui.mode !== "cab";
      document.getElementById("nav").innerHTML = PLACES.map((p) =>
        "<button type=\"button\" data-loc=\"" + p.id + "\"" +
        (locked ? " disabled" : "") +
        (ui.mode === "location" && state.location === p.id ? " class=\"on\"" : "") +
        ">" + p.nav + "</button>"
      ).join("");
    }

    function render() {
      const playing = ui.mode !== "title" && ui.mode !== "confirm";
      document.getElementById("meters").hidden = !playing;
      document.getElementById("nav").hidden = !playing || ui.mode === "cab" || ui.mode === "location";
      document.getElementById("objective").hidden = !playing;
      if (playing) {
        const g = goal();
        const ready = state.money >= g.cost;
        const obj = document.getElementById("objective");
        obj.className = ready ? "ready" : "";
        const caso = currentTale();
        obj.textContent = caso
          ? caso.title + "  ·  " + (state.tale.step + 1) + "/" + caso.steps.length
          : g.title + "  " + euro(state.money) + " / " + euro(g.cost) + (ready ? "  · FECHA" : "");
        document.getElementById("day").textContent = "DIA " + String(state.day).padStart(2, "0");
        renderMeters();
        renderNav();
      } else {
        document.getElementById("day").textContent = "noite";
      }

      document.getElementById("copy").innerHTML = renderCopy();
      const list = currentChoices();
      ui.choicesLive = list;
      const pictorial = ui.mode === "talk" || (ui.mode === "location" && ui.scene !== "rua");
      document.getElementById("choices").innerHTML = pictorial ? "" : list.map((c, i) =>
        "<button type=\"button\" data-i=\"" + i + "\"" + (c.disabled ? " disabled" : "") +
        (c.hint ? " title=\"" + String(c.hint).replace(/"/g, "") + "\"" : "") + ">" +
        (i + 1) + " " + c.label + "</button>"
      ).join("");

      const bookCount = playing ? state.notebook.filter((s) => !s.used).length : 0;
      const canMove = ui.mode === "location" || ui.mode === "notebook" || ui.mode === "cab";
      document.getElementById("foot").innerHTML =
        (canMove ? "<button type=\"button\" id=\"btn-rua\">Rua</button> <button type=\"button\" id=\"btn-book\">Caderno " + bookCount + "</button> " : "") +
        "<button type=\"button\" id=\"btn-sound\">" + (state.sound ? "Som" : "Mudo") + "</button>";

      draw(ui.mode === "title" || ui.mode === "confirm" ? "title" : (ui.scene || state.location));
      const crt = document.getElementById("crt");
      if (ui.shake) {
        crt.classList.remove("shake");
        void crt.offsetWidth;
        crt.classList.add("shake");
        ui.shake = false;
      }
    }

    function rect(g, x, y, w, h, col) {
      g.fillStyle = col;
      g.fillRect(x | 0, y | 0, w | 0, h | 0);
    }

    function spot(x, y, w, h, fn) {
      ui.spots.push({ x: x, y: y, w: w, h: h, fn: fn });
    }

    function blob(g, x, y, w, h, r, col) {
      g.fillStyle = col;
      g.beginPath();
      g.roundRect(x, y, w, h, r);
      g.fill();
    }

    function fade(g, x, y, w, h, c0, c1) {
      const grd = g.createLinearGradient(x, y, x, y + h);
      grd.addColorStop(0, c0);
      grd.addColorStop(1, c1);
      g.fillStyle = grd;
      g.fillRect(x, y, w, h);
    }

    function drawGuy(g, kind, x, y, s, mood, prop) {
      s = s || 2;
      mood = mood || "";
      prop = prop || "";
      const kit = {
        ze: { hair: "#4a2a14", cloth: "#f7f1e8", pants: "#243e86", hat: "", extra: "apron", skin: "#f0b892" },
        velho: { hair: "#f4f1ea", cloth: "#6d6a72", pants: "#2a2a44", hat: "", extra: "cane", skin: "#e3b89a" },
        mulher: { hair: "#6a3820", cloth: "#c4478c", pants: "#8d2460", hat: "", extra: "bun", skin: "#f0b892" },
        beto: { hair: "#2c1a10", cloth: "#3c63d6", pants: "#f2f2f2", hat: "shades", extra: "", skin: "#e8b08a" },
        farda: { hair: "#2a2a2a", cloth: "#1f7a3a", pants: "#1a1a1a", hat: "cap", extra: "", skin: "#e8b08a" },
        presidente: { hair: "#d5d2cc", cloth: "#2a4eb8", pants: "#7a3030", hat: "", extra: "tie", skin: "#efb89a" },
        manel: { hair: "#4a2a14", cloth: "#e2c14a", pants: "#4e4a44", hat: "capy", extra: "", skin: "#e0a67e" },

    function spawnFP(loc, entry) {
      const map = WORLD[loc] || WORLD.tasca;
      const spot = (entry && map.entries && map.entries[entry]) || map.spawn;
      ui.fp = { loc: loc, x: spot.x, y: spot.y, a: spot.a, lock: 0.6, step: 0, bar: false };
    }

    function fpFacing(tx, ty) {
      let d = Math.atan2(ty - ui.fp.y, tx - ui.fp.x) - ui.fp.a;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      return Math.abs(d) < 0.9;
    }

    function atBar() {
      if (!ui.fp || ui.fp.loc !== "tasca" || !ui.cab) return false;
      const focus = WORLD.tasca.focus;
      const dist = Math.hypot(ui.fp.x - focus.x, ui.fp.y - focus.y);
      const facing = fpFacing(focus.x, focus.y);
      const was = !!ui.fp.bar;
      if (ui.fp.bar) {
        if (dist > 1.9 || !facing) ui.fp.bar = false;
      } else if (dist < 1.35 && facing) ui.fp.bar = true;
      if (was !== !!ui.fp.bar && !ui._barSync) {
        ui._barSync = true;
        render();
        ui._barSync = false;
      }
      return !!ui.fp.bar;
    }

    function atCounter() {
      if (!ui.fp || ui.fp.loc === "tasca" || ui.fp.loc === "rua") return false;
      return Math.hypot(ui.fp.x - 3.5, ui.fp.y - 1.7) < 2.5;
    }

    function mapSolid(map, x, y) {
      const row = map.grid[Math.floor(y)];
      if (!row) return true;
      const cell = row[Math.floor(x)];
      return !cell || cell === "#";
    }

    function canStep(map, x, y) {
      const r = 0.12;
      return !mapSolid(map, x - r, y - r) && !mapSolid(map, x + r, y - r) && !mapSolid(map, x - r, y + r) && !mapSolid(map, x + r, y + r);
    }

    function tickFP(dt) {
      if (ui.mode !== "cab" && ui.mode !== "location") return;
      if (!ui.fp) spawnFP(ui.scene === "rua" ? "rua" : (state.location || "tasca"), ui.scene === "rua" ? "tasca" : "bar");
      const p = ui.fp;
      const map = WORLD[p.loc];
      if (!map) return;
      p.lock = Math.max(0, (p.lock || 0) - dt);
      if (atBar()) {
        if (held.s || held.arrowdown) {
          const speed = 2.4 * dt;
          const nx = p.x - Math.cos(p.a) * speed;
          const ny = p.y - Math.sin(p.a) * speed;
          if (canStep(map, nx, p.y)) p.x = nx;
          if (canStep(map, p.x, ny)) p.y = ny;
          p.step = (p.step || 0) + dt * 7;
        }
        return;
      }
      let turn = 0;
      if (held.q || held.arrowleft) turn -= 1;
      if (held.e || held.arrowright) turn += 1;
      p.a += turn * 2.1 * dt + (ui.look || 0);
      ui.look = 0;
      let forward = 0;
      let strafe = 0;
      if (held.w || held.arrowup) forward += 1;
      if (held.s || held.arrowdown) forward -= 1;
      if (held.d) strafe += 1;
      if (held.a) strafe -= 1;
      if (forward || strafe) p.step = (p.step || 0) + dt * 7;
      const speed = 2.6 * dt;
      const nx = p.x + Math.cos(p.a) * forward * speed + Math.cos(p.a + Math.PI / 2) * strafe * speed;
      const ny = p.y + Math.sin(p.a) * forward * speed + Math.sin(p.a + Math.PI / 2) * strafe * speed;
      if (canStep(map, nx, p.y)) p.x = nx;
      if (canStep(map, p.x, ny)) p.y = ny;
      if (p.lock > 0) return;
      const doorAt = (x, y) => {
        const cx = Math.floor(x);
        const cy = Math.floor(y);
        if ((map.grid[cy] || "")[cx] !== "D") return null;
        return (map.doors || []).find((d) => d.x === cx && d.y === cy) || null;
      };
      const door = doorAt(p.x, p.y) || doorAt(p.x + Math.cos(p.a) * 0.62, p.y + Math.sin(p.a) * 0.62);
      if (door) useDoor(door);
      if (ui.barkT > 0) {
        ui.barkT -= dt;
        if (ui.barkT <= 0) {
          ui.bark = "";
          ui.barkT = 0;
          render();
        }
      }
      const said = storyLine();
      if (said !== ui.storySig) {
        ui.storySig = said;
        render();
      }
    }

    function mixShade(hex, f) {
      const n = parseInt(hex.slice(1), 16);
      const r = Math.max(0, Math.min(255, ((n >> 16) & 255) * f)) | 0;
      const gch = Math.max(0, Math.min(255, ((n >> 8) & 255) * f)) | 0;
      const b = Math.max(0, Math.min(255, (n & 255) * f)) | 0;
      return "rgb(" + r + "," + gch + "," + b + ")";
    }

    function castRay(map, px, py, angle) {
      const sin = Math.sin(angle);
      const cos = Math.cos(angle);
      let mapX = Math.floor(px);
      let mapY = Math.floor(py);
      const deltaX = Math.abs(1 / (Math.abs(cos) < 1e-6 ? 1e-6 : cos));
      const deltaY = Math.abs(1 / (Math.abs(sin) < 1e-6 ? 1e-6 : sin));
      let stepX;
      let stepY;
      let sideX;
      let sideY;
      if (cos < 0) { stepX = -1; sideX = (px - mapX) * deltaX; }
      else { stepX = 1; sideX = (mapX + 1 - px) * deltaX; }
      if (sin < 0) { stepY = -1; sideY = (py - mapY) * deltaY; }
      else { stepY = 1; sideY = (mapY + 1 - py) * deltaY; }
      let hit = 0;
      let side = 0;
      for (let guard = 0; guard < 48 && !hit; guard++) {
        if (sideX < sideY) {
          sideX += deltaX;
          mapX += stepX;
          side = 0;
        } else {
          sideY += deltaY;
          mapY += stepY;
          side = 1;
        }
        const row = map.grid[mapY];
        const cell = row ? row[mapX] : "#";
        if (!row || cell === "#" || cell === "D") hit = cell === "D" ? 2 : 1;
      }
      const dist = Math.max(0.05, side === 0 ? sideX - deltaX : sideY - deltaY);
      let hitX;
      let hitY;
      if (side === 0) {
        hitX = stepX > 0 ? mapX : mapX + 1;
        hitY = py + (hitX - px) * (sin / (Math.abs(cos) < 1e-6 ? 1e-6 : cos));
      } else {
        hitY = stepY > 0 ? mapY : mapY + 1;
        hitX = px + (hitY - py) * (cos / (Math.abs(sin) < 1e-6 ? 1e-6 : sin));
      }
      const tex = side === 0 ? hitY : hitX;
      return { dist: dist, hit: hit, side: side, mapX: mapX, mapY: mapY, u: tex - Math.floor(tex) };
    }

    function facadeKey(hit) {
      const south = hit.mapY >= 5;
      const x = hit.mapX;
      if (south) return x < 9 ? "feira" : x < 19 ? "matos" : "gnr";
      if (hit.mapX <= 0 || hit.mapX >= 33) return "muro";
      return x < 9 ? "tasca" : x < 19 ? "garagem" : "junta";
    }
