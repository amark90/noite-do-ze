      junta: { wall: "#e4ddd0", dark: "#b7b0a4", glow: "#f4e7c4" },
      feira: { wall: "#e2b15a", dark: "#a87830", glow: "#ffe08a" },
      matos: { wall: "#6a3038", dark: "#3a181c", glow: "#ffd27a" },
      gnr: { wall: "#2f5c3a", dark: "#1c3024", glow: "#d7ead4" },
      muro: { wall: "#6a5648", dark: "#3e3228", glow: "#c4b4a4" }
    };

    function drawProp(g, kind, screenX, horizon, size) {
      if (kind === "balcao") {
        const w = size * 2.3;
        const h = size * 0.62;
        const y = horizon - h * 0.05;
        g.fillStyle = "#3a2418";
        g.fillRect(screenX - w / 2, y, w, h);
        g.fillStyle = "#c4a574";
        g.fillRect(screenX - w / 2, y, w, Math.max(3, h * 0.14));
        g.fillStyle = "#6b4228";
        for (let i = 0; i < 5; i++) g.fillRect(screenX - w / 2 + 6 + i * (w / 5), y + h * 0.28, Math.max(4, w / 9), h * 0.55);
        [["#e2b15a", -0.32], ["#2f6b3a", -0.12], ["#8d3a32", 0.1], ["#f4e7cf", 0.3]].forEach((b) => {
          g.fillStyle = b[0];
          g.fillRect(screenX + w * b[1], y - h * 0.42, Math.max(3, w * 0.06), h * 0.4);
          g.fillStyle = "#2a2118";
          g.fillRect(screenX + w * b[1] + 1, y - h * 0.52, Math.max(2, w * 0.025), h * 0.12);
        });
        return;
      }
      if (kind === "barril") {
        const w = size * 0.72;
        const h = size * 0.9;
        const y = horizon - h * 0.85;
        g.fillStyle = "#6b4228";
        g.beginPath();
        g.ellipse(screenX, y + h * 0.5, w / 2, h / 2, 0, 0, Math.PI * 2);
        g.fill();
        g.strokeStyle = "#2a1810";
        g.lineWidth = Math.max(1, size * 0.04);
        g.beginPath();
        g.ellipse(screenX, y + h * 0.22, w * 0.42, h * 0.08, 0, 0, Math.PI * 2);
        g.stroke();
        g.beginPath();
        g.ellipse(screenX, y + h * 0.78, w * 0.42, h * 0.08, 0, 0, Math.PI * 2);
        g.stroke();
        g.fillStyle = "#c4a574";
        g.fillRect(screenX - 1, y + h * 0.4, 2, h * 0.16);
        return;
      }
      if (kind === "caixa") {
        const w = size * 0.8;
        const h = size * 0.55;
        const y = horizon - h;
        g.fillStyle = "#c48a3a";
        g.fillRect(screenX - w / 2, y, w, h);
        g.strokeStyle = "#6a4018";
        g.lineWidth = 1;
        g.strokeRect(screenX - w / 2, y, w, h);
        g.beginPath();
        g.moveTo(screenX - w / 2, y + h * 0.5);
        g.lineTo(screenX + w / 2, y + h * 0.5);
        g.moveTo(screenX, y);
        g.lineTo(screenX, y + h);
        g.stroke();
        return;
      }
      if (kind === "lampiao") {
        const h = size * 1.5;
        g.fillStyle = "#2a241e";
        g.fillRect(screenX - 1.5, horizon - h, 3, h);
        const glow = g.createRadialGradient(screenX, horizon - h, 2, screenX, horizon - h, size * 0.7);
        glow.addColorStop(0, "rgba(255, 196, 110, 0.95)");
        glow.addColorStop(1, "rgba(255, 160, 60, 0)");
        g.fillStyle = glow;
        g.beginPath();
        g.arc(screenX, horizon - h, size * 0.7, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = "#ffe0a8";
        g.beginPath();
        g.arc(screenX, horizon - h, Math.max(3, size * 0.12), 0, Math.PI * 2);
        g.fill();
        return;
      }
      if (kind === "cofre") {
        const w = size * 0.7;
        const h = size * 0.8;
        const y = horizon - h;
        g.fillStyle = "#2a2e34";
        g.fillRect(screenX - w / 2, y, w, h);
        g.strokeStyle = "#c4a574";
        g.strokeRect(screenX - w / 2, y, w, h);
        g.fillStyle = "#e2b15a";
        g.beginPath();
        g.arc(screenX, y + h * 0.55, Math.max(2, w * 0.12), 0, Math.PI * 2);
        g.fill();
        return;
      }
      if (kind === "faixa") {
        const w = size * 0.9;
        const y = horizon - size * 0.35;
        g.fillStyle = "#1c6b3a";
        g.fillRect(screenX - w / 2, y, w, size * 0.16);
        g.fillStyle = "#c4473a";
        g.fillRect(screenX - w / 2, y + size * 0.05, w, size * 0.05);
        g.fillStyle = "#e6c56a";
        g.fillRect(screenX - w * 0.08, y, w * 0.16, size * 0.16);
        return;
      }
      if (kind === "santo") {
        const h = size * 0.7;
        const y = horizon - h;
        g.fillStyle = "#f4e7cf";
        g.fillRect(screenX - size * 0.16, y, size * 0.32, h);
        g.fillStyle = "#2a4eb8";
        g.beginPath();
        g.arc(screenX, y + h * 0.28, size * 0.12, 0, Math.PI * 2);
        g.fill();
        g.fillStyle = "#e6c56a";
        g.fillRect(screenX - size * 0.22, y + h * 0.86, size * 0.44, size * 0.08);
        return;
      }
      if (kind === "quadro") {
        const w = size * 0.9;
        const h = size * 0.7;
        const y = horizon - h * 1.3;
        g.fillStyle = "#5c3a28";
        g.fillRect(screenX - w / 2 - 2, y - 2, w + 4, h + 4);
        g.fillStyle = "#f4e7cf";
        g.fillRect(screenX - w / 2, y, w, h);
        g.fillStyle = "#2a4eb8";
        g.fillRect(screenX - w * 0.2, y + h * 0.25, w * 0.4, h * 0.45);
      }
    }

    let fpCanvas = null;
    let fpCtx = null;
    let fpImg = null;
    const HDW = 960;
    const HDH = 540;
    const RGBC = {};

    function rgbOf(hex) {
      let c = RGBC[hex];
      if (!c) {
        const n = parseInt(hex.slice(1), 16);
        c = RGBC[hex] = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }
      return c;
    }

    function hdStamp(data, x, y, r, gch, b) {
      if (x < 0 || y < 0 || x >= HDW || y >= HDH) return;
      const i = (y * HDW + x) << 2;
      data[i] = r;
      data[i + 1] = gch;
      data[i + 2] = b;
      data[i + 3] = 255;
    }

    function hdSpan(data, x, y0, y1, hex, light) {
      const c = rgbOf(hex);
      const yA = Math.max(0, y0 | 0);
      const yB = Math.min(HDH - 1, y1 | 0);
      const x1 = x + 1 < HDW ? x + 1 : x;
      for (let y = yA; y <= yB; y++) {
        const n = (x * 17 + y * 13) & 31;
        const k = Math.max(0, Math.min(1.08, light * (0.94 + n / 520)));
        const r = Math.min(255, c[0] * k) | 0;
        const gch = Math.min(255, c[1] * k) | 0;
        const b = Math.min(255, c[2] * k) | 0;
        hdStamp(data, x, y, r, gch, b);
        if (x1 !== x) hdStamp(data, x1, y, r, gch, b);
      }
    }

    function renderHD(p, map, horizonHD) {
      if (!fpCanvas) {
        fpCanvas = document.createElement("canvas");
        fpCanvas.width = HDW;
        fpCanvas.height = HDH;
        fpCtx = fpCanvas.getContext("2d", { alpha: false });
        fpImg = fpCtx.createImageData(HDW, HDH);
      }
      const data = fpImg.data;
      const fov = 1.9;
      const dirX = Math.cos(p.a);
      const dirY = Math.sin(p.a);
      const planeX = Math.cos(p.a + Math.PI / 2) * Math.tan(fov / 2);
      const planeY = Math.sin(p.a + Math.PI / 2) * Math.tan(fov / 2);
      const skyTop = map.out ? [18, 28, 48] : (p.loc === "tasca" ? [42, 26, 18] : [28, 22, 18]);
      const skyBot = map.out ? [214, 156, 112] : [72, 48, 34];
      const hY = Math.max(1, horizonHD | 0);
      for (let y = 0; y < HDH; y += 2) {
        const t = Math.max(0, Math.min(1, y / hY));
        const r = (skyTop[0] + (skyBot[0] - skyTop[0]) * t) | 0;
        const gch = (skyTop[1] + (skyBot[1] - skyTop[1]) * t) | 0;
        const b = (skyTop[2] + (skyBot[2] - skyTop[2]) * t) | 0;
        const beam = !map.out && p.loc === "tasca" && (y % 54) < 7;
        for (let x = 0; x < HDW; x += 2) {
          const rr = beam ? (r * 0.55) | 0 : r;
          const gg = beam ? (gch * 0.5) | 0 : gch;
          const bb = beam ? (b * 0.45) | 0 : b;
          hdStamp(data, x, y, rr, gg, bb);
          hdStamp(data, x + 1, y, rr, gg, bb);
          if (y + 1 < HDH) {
            hdStamp(data, x, y + 1, rr, gg, bb);
            hdStamp(data, x + 1, y + 1, rr, gg, bb);
          }
        }
      }
      const alt = map.floorAlt || "#2a1c14";
      for (let y = hY; y < HDH; y += 2) {
        const perp = 216 / Math.max(1, y - horizonHD);
        const fog = Math.max(0.46, 1 - perp * 0.065);
        for (let x = 0; x < HDW; x += 2) {
          const cam = x / 480 - 1;
          const wx = p.x + perp * (dirX + planeX * cam);
          const wy = p.y + perp * (dirY + planeY * cam);
          let base;
          let tone = 1;
          if (map.out) {
            const fx = wx * 7.5;
            const fy = wy * 7.5;
            const fu = fx - Math.floor(fx);
            const fv = fy - Math.floor(fy);
            const edge = Math.max(Math.abs(fu - 0.5), Math.abs(fv - 0.5));
            const onRoad = wy > 2.2 && wy < 5.3;
            const n = (Math.floor(fx) * 13 + Math.floor(fy) * 7) & 7;
            base = onRoad ? [132, 118, 104] : [78, 68, 60];
            tone = 0.82 + n * 0.035;
            if (edge > 0.46) tone *= 0.55;
            else if (fu < 0.22 && fv < 0.22) tone *= 1.12;
          } else {
            const plank = Math.floor(wx * 1.7);
            const u = (wx * 1.7) - plank;
            const n = (plank * 17) & 7;
            base = p.loc === "tasca" ? [126, 78, 46] : rgbOf(map.floor);
            tone = 0.78 + n * 0.04;
            if (u < 0.045) tone *= 0.45;
            if (((Math.floor(wy * 22) + plank) & 9) === 0) tone *= 0.88;
          }
          const c = base;
          const k = fog * tone * (0.96 + ((x + y) & 7) / 140);
          const r = Math.min(255, c[0] * k) | 0;
          const gch = Math.min(255, c[1] * k) | 0;
          const b = Math.min(255, c[2] * k) | 0;
          hdStamp(data, x, y, r, gch, b);
          hdStamp(data, x + 1, y, r, gch, b);
          if (y + 1 < HDH) {
            hdStamp(data, x, y + 1, r, gch, b);
            hdStamp(data, x + 1, y + 1, r, gch, b);
          }
        }
      }
      const zbuf = new Array(320);
      const doorMarks = {};
      for (let x = 0; x < HDW; x += 2) {
        const angle = p.a - fov / 2 + (x / HDW) * fov;
        const hit = castRay(map, p.x, p.y, angle);
        const lx = Math.max(0, Math.min(319, (x / 3) | 0));
        zbuf[lx] = hit.dist;
        if (lx + 1 < 320) zbuf[lx + 1] = hit.dist;
        const colH = Math.min(520, 450 / hit.dist);
        const top = horizonHD - colH / 2;
        const fog = Math.max(0.4, 1 - hit.dist * 0.07);
        const shade = fog * (hit.side ? 0.74 : 1);
        const u = hit.u || 0;
        let hex = hit.side ? map.wallDark : map.wall;
        let face = null;
        if (map.out && hit.hit !== 2) {
          face = FACADE[facadeKey(hit)] || FACADE.muro;
          hex = hit.side ? face.dark : face.wall;
        } else if (p.loc === "tasca" && hit.hit !== 2) {
          hex = hit.side ? "#8d7058" : "#cbb292";
        }
        if (hit.hit === 2) {
          const tint = (map.doorTint && map.doorTint[hit.mapX + "," + hit.mapY]) || "#6a4630";
          hex = (u < 0.08 || u > 0.92) ? "#2a1810" : (hit.side ? "#4a3024" : tint);
        } else if (u < 0.035 || u > 0.965) hex = "#1c120c";
        hdSpan(data, x, top, top + colH, hex, shade);
        if (hit.hit === 2 && u > 0.08 && u < 0.92) {
          hdSpan(data, x, top + colH * 0.4, top + colH * 0.46, "#f0d7a2", Math.min(1, shade + 0.2));
          if (u > 0.7 && u < 0.78) hdSpan(data, x, top + colH * 0.5, top + colH * 0.58, "#e6c56a", 1);
          const key = hit.mapX + "," + hit.mapY;
          const markX = x / 3;
          if (!doorMarks[key] || Math.abs(markX - 160) < Math.abs(doorMarks[key].x - 160)) {
            doorMarks[key] = { x: markX, y: top / 3, h: colH / 3, dist: hit.dist };
          }
        } else if (map.out && face && colH > 28) {
          if (u > 0.3 && u < 0.7) {
            const mullion = u > 0.47 && u < 0.53;
            hdSpan(data, x, top + colH * 0.2, top + colH * 0.52, mullion ? face.dark : face.glow, Math.min(1.05, shade + 0.18));
            hdSpan(data, x, top + colH * 0.34, top + colH * 0.37, face.dark, shade);
          }
          if (face === FACADE.feira) hdSpan(data, x, top, top + colH * 0.1, (Math.floor(u * 8) % 2) ? "#8d3a32" : "#f4e7cf", shade);
          if (face === FACADE.gnr) hdSpan(data, x, top + colH * 0.58, top + colH * 0.64, "#f4f1ea", shade);
          if (face === FACADE.junta && u > 0.4 && u < 0.6) hdSpan(data, x, top + colH * 0.28, top + colH * 0.46, "#2a4eb8", shade);
          hdSpan(data, x, top + colH * 0.84, top + colH, "#1a100c", shade * 0.8);
        } else if (p.loc === "tasca" && hit.hit !== 2 && colH > 30) {
          hdSpan(data, x, top + colH * 0.6, top + colH, "#5c3a28", shade);
          if (hit.mapY === 0 && (u % 0.16) < 0.05) {
            const bottles = ["#e2b15a", "#2f6b3a", "#8d3a32", "#f4e7cf"];
            hdSpan(data, x, top + colH * 0.16, top + colH * 0.36, bottles[Math.floor(u * 10) % 4], Math.min(1, shade + 0.1));
          }
        }
      }
      fpCtx.putImageData(fpImg, 0, 0);
      if (map.out) {
        const moonX = 140;
        const moonY = 78 + (horizonHD - 234) * 0.15;
        const glow = fpCtx.createRadialGradient(moonX, moonY, 8, moonX, moonY, 70);
        glow.addColorStop(0, "rgba(255, 244, 220, 0.95)");
        glow.addColorStop(0.25, "rgba(255, 228, 190, 0.35)");
        glow.addColorStop(1, "rgba(255, 228, 190, 0)");
        fpCtx.fillStyle = glow;
        fpCtx.beginPath();
        fpCtx.arc(moonX, moonY, 70, 0, Math.PI * 2);
        fpCtx.fill();
        fpCtx.fillStyle = "rgba(255, 220, 190, 0.12)";
        fpCtx.beginPath();
        fpCtx.ellipse(640, 110, 180, 22, -0.1, 0, Math.PI * 2);
        fpCtx.fill();
      } else {
        const lamp = fpCtx.createRadialGradient(480, 36, 6, 480, 70, 240);
        lamp.addColorStop(0, "rgba(255, 214, 150, 0.55)");
        lamp.addColorStop(1, "rgba(255, 170, 80, 0)");
        fpCtx.fillStyle = lamp;
        fpCtx.fillRect(0, 0, HDW, hY);
      }
      const vig = fpCtx.createRadialGradient(480, 270, 160, 480, 300, 560);
      vig.addColorStop(0, "rgba(0,0,0,0)");
      vig.addColorStop(1, "rgba(12, 6, 4, 0.38)");
      fpCtx.fillStyle = vig;
      fpCtx.fillRect(0, 0, HDW, HDH);
      return { zbuf: zbuf, doorMarks: doorMarks, fov: fov };
    }

    function drawFP(g) {
      const p = ui.fp;
      const map = WORLD[p.loc] || WORLD.tasca;
      const bob = Math.sin(p.step || 0) * 3;
      const horizon = 78 + bob;
      const hd = renderHD(p, map, horizon * 3);
      const fov = hd.fov;
      const zbuf = hd.zbuf;
      const doorMarks = hd.doorMarks;
      const saved = g.getTransform();
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.imageSmoothingEnabled = true;
      g.drawImage(fpCanvas, 0, 0, g.canvas.width, g.canvas.height);
      g.setTransform(saved);
      const doorNames = { tasca: "O Pica-Pau", garagem: "Garagem", junta: "Junta", feira: "Feira", matos: "Sr. Matos", gnr: "GNR", rua: "Rua" };
      g.font = "700 10px Georgia, 'Times New Roman', serif";
      g.textAlign = "center";
      g.textBaseline = "bottom";
      Object.keys(doorMarks).forEach((key) => {
        const mark = doorMarks[key];
        if (mark.dist > 9) return;
        const parts = key.split(",");
        const door = (map.doors || []).find((d) => d.x === Number(parts[0]) && d.y === Number(parts[1]));
        if (!door) return;
        const label = doorNames[door.to] || door.to;
        const tw = Math.max(36, label.length * 6.2);
        g.fillStyle = "#3a2418";
        g.fillRect(mark.x - tw / 2 - 2, mark.y - 18, tw + 4, 15);
        g.fillStyle = "#e7d3b0";
        g.fillRect(mark.x - tw / 2, mark.y - 16, tw, 11);
        g.fillStyle = "#3a2418";
        g.fillText(label, mark.x, mark.y - 6);
      });
      g.textAlign = "left";
      g.textBaseline = "alphabetic";
      const caso = currentStep();
      const sprites = (map.sprites || []).filter((spr) => {
        if (!spr.who || !caso || !caso.who) return true;
        if (p.loc === "rua" && caso.loc !== "rua" && spr.who === caso.who) return false;
        return true;
      }).slice();
      if (caso && caso.loc === p.loc && caso.who && !sprites.some((s) => s.who === caso.who && Math.hypot(s.x - caso.x, s.y - caso.y) < 1.2)) {
        sprites.push({ x: caso.x, y: caso.y, who: caso.who, name: caso.name, mood: "talk", hand: caso.hand || "" });
      }
      if (caso && caso.loc === p.loc && caso.prop && state.carry !== caso.item) sprites.push({ x: caso.x, y: caso.y, prop: caso.prop });
      if (p.loc === "tasca") {
        sprites.push({ x: 3.5, y: 2.35, prop: "balcao" });
        sprites.push({ x: 1.55, y: 3.3, prop: "barril" });
        sprites.push({ x: 6.35, y: 4.6, prop: "barril" });
        sprites.push({ x: 1.7, y: 6.5, prop: "barril" });
      }
      if (p.loc === "tasca" && state.pending) {
        const person = personById(state.pending);
        if (person) sprites.push({ x: WORLD.tasca.focus.x, y: WORLD.tasca.focus.y, who: person.sprite, name: person.name, hand: "glass", mood: "talk" });
      }
      sprites.forEach((spr) => { spr._dist = Math.hypot(spr.x - p.x, spr.y - p.y); });
      sprites.sort((a, b) => b._dist - a._dist);
      sprites.forEach((spr) => {
        const dist = spr._dist;
        if (dist < 0.25) return;
        let ang = Math.atan2(spr.y - p.y, spr.x - p.x) - p.a;
        while (ang > Math.PI) ang -= Math.PI * 2;
        while (ang < -Math.PI) ang += Math.PI * 2;
        if (Math.abs(ang) > fov * 0.7) return;
        const screenX = 160 + Math.tan(ang) / Math.tan(fov / 2) * 160;
        const size = Math.min(74, 108 / dist);
        const col = Math.max(0, Math.min(318, screenX | 0));
        if (zbuf[col] && zbuf[col] + 0.15 < dist) return;
        if (spr.prop && !spr.who) {
          drawProp(g, spr.prop, screenX, horizon, size);
          return;
        }
        g.save();
        g.fillStyle = "rgba(10, 6, 4, 0.28)";
        g.beginPath();
        g.ellipse(screenX, horizon + 2, size * 0.22, size * 0.06, 0, 0, Math.PI * 2);
        g.fill();
        g.restore();
        drawGuy(g, spr.who, screenX - size * 0.22, horizon - size * 0.78, size / 26, spr.mood || "talk", spr.hand || "");
        if (spr.name && dist < 4.2) {
          g.font = "700 8px Georgia, 'Times New Roman', serif";
          g.textAlign = "center";
          g.textBaseline = "bottom";
          const tw = Math.max(28, spr.name.length * 5);
          const ny = horizon - size * 0.82;
          g.fillStyle = "rgba(28, 16, 10, 0.78)";
          g.fillRect(screenX - tw / 2, ny - 11, tw, 11);
          g.fillStyle = "#f6e7c8";
          g.fillText(spr.name, screenX, ny - 1);
          g.textAlign = "left";
          g.textBaseline = "alphabetic";
        }
      });
      if (caso && caso.loc === p.loc) {
        const dx = caso.x - p.x;
        const dy = caso.y - p.y;
        const distM = Math.hypot(dx, dy);
        let angM = Math.atan2(dy, dx) - p.a;
        while (angM > Math.PI) angM -= Math.PI * 2;
        while (angM < -Math.PI) angM += Math.PI * 2;
        if (distM > 0.4 && Math.abs(angM) < fov * 0.7) {
          const mx = 160 + Math.tan(angM) / Math.tan(fov / 2) * 160;
          const my = horizon - Math.min(90, 86 / distM) + Math.sin(tick / 7) * 4;
          g.fillStyle = "#e6c56a";
          g.beginPath();
          g.moveTo(mx, my + 10);
          g.lineTo(mx - 8, my - 2);
          g.lineTo(mx + 8, my - 2);
          g.closePath();
          g.fill();
        }
      }
      const say = (ui.mode === "cab" || ui.mode === "location") ? storyLine() : "";
      if (say && !atBar()) {
        const rows = wrapWords(say, 42).slice(0, 2);
        const bh = 8 + rows.length * 12;
        g.fillStyle = "rgba(22, 12, 8, 0.9)";
        g.beginPath();
        g.roundRect(10, 4, 300, bh, 8);
        g.fill();
        g.fillStyle = "#f6e7c8";
        g.font = "700 9px Georgia, 'Times New Roman', serif";
        g.textAlign = "center";
        g.textBaseline = "top";
        rows.forEach((ln, i) => g.fillText(ln, 160, 8 + i * 12));
        g.textAlign = "left";
        g.textBaseline = "alphabetic";
      }
      g.fillStyle = "rgba(255,255,255,0.85)";
      g.fillRect(159, horizon - 1, 2, 2);
      if (!map.out) {
        g.fillStyle = "rgba(40, 18, 8, 0.16)";
        g.fillRect(0, 0, 14, 180);
        g.fillRect(306, 0, 14, 180);
      }
    }

    function draw(scene) {
      const canvas = document.getElementById("view");
      const g = canvas.getContext("2d");
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, canvas.width, canvas.height);
      g.setTransform(canvas.width / 320, 0, 0, canvas.height / 180, 0, 0);
      g.imageSmoothingEnabled = true;
      g.globalAlpha = 1;
      ui.spots = ui.spots || [];
      ui.spots.length = 0;
      if (scene === "title" || ui.mode === "confirm") drawTitle(g);
      else if (ui.fp && ui.mode !== "notebook") {
        if (atBar()) drawCab(g);
        else {
          drawFP(g);
          if (atCounter()) paintCounter(g);
        }
      } else if (scene === "rua") drawRua(g);
      else drawRoom(g, scene || "tasca");
      drawFlash(g);
      drawFloats(g);
      drawHot(g);
      if (ui.mode === "result" || ui.mode === "over" || ui.mode === "confirm") {
        const lines = ui.lines || [];
        const beat = lines[Math.min(ui.beat || 0, Math.max(0, lines.length - 1))] || "";
        const rows = wrapWords(beat, 40).slice(0, 6);
        g.fillStyle = "rgba(12, 8, 6, 0.72)";
        g.fillRect(0, 0, 320, 180);
        g.fillStyle = "#f4e6cf";
        g.beginPath();
        g.roundRect(14, 12, 292, 156, 12);
        g.fill();
        g.fillStyle = "#6a3028";
        g.font = "700 13px Georgia, 'Times New Roman', serif";
        g.textAlign = "center";
        g.textBaseline = "top";
        g.fillText(ui.title || "", 160, 22);
        g.fillStyle = "#2a2118";
        g.font = "600 11px Georgia, 'Times New Roman', serif";
        rows.forEach((ln, i) => g.fillText(ln, 160, 46 + i * 15));
        if ((ui.mode === "result" || ui.mode === "over") && (ui.beat || 0) < lines.length - 1) {
          g.fillStyle = "#8d3a32";
          g.font = "700 10px Georgia, 'Times New Roman', serif";
          g.fillText("clica para continuar", 160, 148);
        }
        g.textAlign = "left";
        g.textBaseline = "alphabetic";
      }
    }

    function choose(choice) {
      if (!choice || choice.disabled) return;
      try {
        unlockAudio();
        choice.fn();
      } catch (err) {
        console.error(err);
        window.__tascaErrors = window.__tascaErrors || [];
        window.__tascaErrors.push(String(err && err.message || err));
        showText("O Zé engasgou-se", [
          "Houve um soluço no motor da tasca.",
          String(err && err.message || err)
        ], [{ label: "Voltar ao balcão", fn: () => arrive(state.location || "tasca", true) }], state.location || "tasca", "blip");
      }
    }

    function confirmNew() {
      const returnMode = ui.mode;
      const returnScene = ui.scene;
      ui.mode = "confirm";
      ui.scene = "title";
      ui.beat = 0;
      ui.title = "Deitar a gravação abaixo?";
      ui.lines = ["Já existe um Zé gravado neste browser. Novo jogo apaga a tasca, a dívida e o caderno. Ele não assina termo nenhum."];
      ui.resultChoices = [
        { label: "Sim, começar do zero", fn: startNew },
        {
          label: "Não, ficar com este Zé",
          fn: () => {
            if (returnMode === "title" || returnMode === "confirm") showTitle();
            else {
              ui.mode = returnMode === "notebook" ? "notebook" : "location";
              ui.scene = returnScene || state.location;
              render();
            }
          }
        }
      ];
      render();
    }

    function showTitle() {
      ui = blankUi();
      ui.mode = "title";
      if (!state) state = freshState();
      render();
    }

    function startNew() {
      const sound = state ? state.sound : true;
      state = freshState();
      state.sound = sound;
      freshQueue();
      ui.mode = "result";
      ui.scene = "tasca";
      ui.visitor = null;
      ui.shake = false;
      const g = goal();
      ui.title = "Abre-se a porta do Pica-Pau";
      ui.lines = [
        "És o Zé. O Pica-Pau deve " + euro(state.debt) + " ao Sr. Matos.",
        "Meta: " + g.title + ", " + euro(g.cost) + ". O honesto não chega lá.",
        "As maroscas pagam. À noite, cobram."
      ];
      ui.beat = 0;
      ui.resultChoices = [{ label: "Entrar na tasca", fn: () => arrive("tasca", true) }];
      sfx("door");
      touch();
      render();
    }

    function continueGame() {
      const data = peekSave();
      if (!data) return;
      state = normalize(data);
      ensureTale();
      ui.visitor = null;
      if (state.location === "tasca") beginCab(true, "bar");
      else {
        ui.mode = "location";
        ui.scene = state.location;
        spawnFP(state.location, "in");
        sfx("door");
        render();
      }
    }

    function openNotebook() {
      if (ui.mode !== "location" && ui.mode !== "notebook" && ui.mode !== "cab") return;
      ui.mode = "notebook";
      ui.scene = state.location;
      sfx("blip");
      render();
    }

    function toggleSound() {
      state.sound = !state.sound;
      if (state.sound) {
        unlockAudio();
        sfx("blip");
      }
      if (ui.mode !== "title" && ui.mode !== "confirm") touch();
      render();
    }

    document.getElementById("ui").addEventListener("click", (event) => {
      const choiceBtn = event.target.closest("#choices button");
      if (choiceBtn) {
        const choice = (ui.choicesLive || [])[Number(choiceBtn.dataset.i)];
        choose(choice);
        return;
      }
      const locBtn = event.target.closest("#nav button");
      if (locBtn && !locBtn.disabled) {
        arrive(locBtn.dataset.loc, false);
        return;
      }
      if (event.target.closest("#btn-rua")) openStreet();
      if (event.target.closest("#btn-book")) openNotebook();
      if (event.target.closest("#btn-sound")) toggleSound();
      if (event.target.closest("#copy") && ui.mode === "act") endAct();
      if (event.target.closest("#copy") && moreBeats()) nextBeat();
    });

    function openStreet() {
      if (ui.mode !== "location" && ui.mode !== "notebook" && ui.mode !== "cab") return;
      ui.scene = "rua";
      ui.visitor = null;
      ui.mode = ui.cab ? "cab" : "location";
      spawnFP("rua", WORLD.rua.entries[state.location] ? state.location : "tasca");
      sfx("door");
      render();
    }

    function canvasPoint(event) {
      const box = event.currentTarget.getBoundingClientRect();
      return {
        x: (event.clientX - box.left) * (320 / box.width),
        y: (event.clientY - box.top) * (180 / box.height)
      };
    }

    const view = document.getElementById("view");
    view.addEventListener("mousemove", (event) => {
      const point = canvasPoint(event);
      ui.mx = point.x;
      ui.my = point.y;
      if ((ui.mode === "cab" || ui.mode === "location") && !atBar()) ui.look = (ui.look || 0) + event.movementX * 0.0045;
      const hot = (ui.spots || []).some((s) => point.x >= s.x && point.x <= s.x + s.w && point.y >= s.y && point.y <= s.y + s.h);
      view.style.cursor = hot ? "pointer" : "crosshair";
    });
    view.addEventListener("mouseleave", () => {
      ui.mx = null;
      ui.my = null;
    });
    view.addEventListener("pointerdown", (event) => {
      if (ui.mode !== "cab" || !atBar()) return;
      unlockAudio();
      event.preventDefault();
      const point = canvasPoint(event);
      ui.mx = point.x;
      ui.my = point.y;
      cabDown(point);
    });
    view.addEventListener("pointermove", (event) => {
      if (ui.mode !== "cab" || !ui.cab) return;
      const point = canvasPoint(event);
      ui.mx = point.x;
      ui.my = point.y;
      const c = ui.cab;
      if (c.drag != null) {
        if (point.x - c.drag > 52 && state.pending && !(c.flashT > 0)) {
          c.drag = null;
          const person = personById(state.pending);
          if (person) doKick(person);
        }
        return;
      }
      if (c.pour || c.flashT > 0) return;
      if (point.y > 108 && point.x >= 48 && point.x <= 120) c.bottle = "honesto";
      if (point.y > 108 && point.x >= 200 && point.x <= 270 && peekIllegal()) c.bottle = "golpe";
    });
    view.addEventListener("pointerup", () => {
      if (ui.mode !== "cab" || !ui.cab) return;
      if (ui.cab.pour) releasePour();
      ui.cab.pour = false;
      if (ui.cab.brakePointer) {
        ui.cab.brake = false;
        ui.cab.brakePointer = false;
      }
      ui.cab.listening = false;
      ui.cab.drag = null;
    });
    view.addEventListener("pointerleave", () => {
      if (ui.mode !== "cab" || !ui.cab) return;
      if (ui.cab.pour) releasePour();
      ui.cab.pour = false;
      if (ui.cab.brakePointer) {
        ui.cab.brake = false;
        ui.cab.brakePointer = false;
      }
      ui.cab.listening = false;
      ui.cab.drag = null;
    });
    view.addEventListener("click", (event) => {
      unlockAudio();
      if (ui.mode === "cab" && atBar()) return;
      if (ui.mode === "act") {
        endAct();
        return;
      }
      if (moreBeats()) {
        nextBeat();
        return;
      }
      const point = canvasPoint(event);
      const hit = (ui.spots || []).slice().reverse().find((s) => point.x >= s.x && point.x <= s.x + s.w && point.y >= s.y && point.y <= s.y + s.h);
      if (!hit) {
        if (canWalk()) walkTo(point.x - 14, point.y - 46, null);
        return;
      }
      try {
        hit.fn();
      } catch (err) {
        console.error(err);
        window.__tascaErrors = window.__tascaErrors || [];
        window.__tascaErrors.push(String(err && err.message || err));
      }
    });

    const held = {};
    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (key === "arrowleft" || key === "arrowright" || key === "arrowup" || key === "arrowdown" || key === "a" || key === "d" || key === "w" || key === "s" || key === "q") {
        held[key] = true;
        event.preventDefault();
      }
      if ((ui.mode === "cab" || ui.mode === "location") && key === "e" && !event.repeat) {
        if (atBar() && ui.cab && state.pending && !(ui.cab.flashT > 0)) {
          ui.cab.listening = true;
          ui.cab.pour = false;
        } else if (talkTale()) {
          event.preventDefault();
          return;
        } else held.e = true;
        event.preventDefault();
      }
      if (ui.mode === "cab" && ui.cab && !event.repeat && !(ui.cab.flashT > 0)) {
        if (key === "shift") {
          event.preventDefault();
          if (atBar()) {
            ui.cab.brake = true;
            ui.cab.pour = false;
          }
          return;
        }
        if (event.key === " " || event.key === "Enter") {
          event.preventDefault();
          if (atBar() && state.pending) {
            ui.cab.pour = true;
            ui.cab.brake = false;
          }
          return;
        }
        if (key === "l") {
          event.preventDefault();
          if (atBar() && state.pending) {
            ui.cab.listening = true;
            ui.cab.pour = false;
          }
          return;
        }
        if (key === "k" && state.pending) {
          const person = personById(state.pending);
          if (person) doKick(person);
          return;
        }
        if (key === "f") {
          endDay();
          return;
        }
      }
      if (event.repeat) return;
      if (event.key === "m" || event.key === "M") {
        toggleSound();
        return;
      }
      if ((event.key === " " || event.key === "Enter") && event.target.tagName !== "BUTTON" && moreBeats()) {
        event.preventDefault();
        nextBeat();
        return;
      }
      const n = Number(event.key);
      if (n >= 1 && n <= 9) {
        const choice = (ui.choicesLive || [])[n - 1];
        if (choice && !choice.disabled) {
          event.preventDefault();
          choose(choice);
        }
      }
    });
    document.addEventListener("keyup", (event) => {
      const key = event.key.toLowerCase();
      held[key] = false;
      if (ui.mode === "cab" && ui.cab) {
        if (event.key === " " || event.key === "Enter") releasePour();
        if (key === "shift") ui.cab.brake = false;
        if (key === "l" || key === "e") ui.cab.listening = false;
      }
    });

    window.addEventListener("error", (event) => {
      window.__tascaErrors = window.__tascaErrors || [];
      window.__tascaErrors.push(String(event.message || event.error || "erro"));
    });

    function canWalk() {
      return false;
    }

    function ensureHero() {
      const scene = ui.scene || state.location || "tasca";
      if (ui.hero && ui.hero.scene === scene) return ui.hero;
      const born = scene === "rua" ? { x: 146, y: 132 } : { x: 36, y: 104 };
      ui.hero = { scene: scene, x: born.x, y: born.y, tx: null, ty: null, job: null };
      return ui.hero;
    }

    function walkTo(x, y, job) {
      const h = ensureHero();
      h.tx = x;
      h.ty = y;
      h.job = job || null;
    }

    function grabPerson() {
      if (!state.pending) {
        if (!state.queue.length) return null;
        state.pending = state.queue.shift();
        if (state.pending === "albertina") state.tutorialDone = true;
      }
      const person = personById(state.pending);
      if (person) ui.visitor = person.sprite;
      return person;
    }

    function moveHero() {
      if (!canWalk()) return;
      const h = ensureHero();
      let dx = 0;
      let dy = 0;
      if (held.arrowleft || held.a) dx -= 1;
      if (held.arrowright || held.d) dx += 1;
      if (held.arrowup || held.w) dy -= 1;
      if (held.arrowdown || held.s) dy += 1;
      if (dx || dy) {
        h.tx = null;
        h.job = null;
        const len = Math.hypot(dx, dy);
        h.x += dx / len * 1.5;
        h.y += dy / len * 1.5;
      } else if (h.tx != null) {
        const vx = h.tx - h.x;
        const vy = h.ty - h.y;
        const dist = Math.hypot(vx, vy);
        if (dist < 4) {
          h.x = h.tx;
          h.y = h.ty;
          h.tx = null;
          const job = h.job;
          h.job = null;
          if (job) job();
        } else {
          const step = Math.min(2.2, dist);
          h.x += vx / dist * step;
          h.y += vy / dist * step;
        }
      }
      if ((ui.scene || state.location) === "rua") {
        h.x = clamp(h.x, 2, 286);
        h.y = clamp(h.y, 118, 140);
      } else {
        h.x = clamp(h.x, 2, 270);
        h.y = clamp(h.y, 92, 118);
      }
    }

    function fitView() {
      const screen = document.getElementById("screen");
      const crt = document.getElementById("crt");
      const view = document.getElementById("view");
      const foot = document.getElementById("foot");
      const sw = screen.clientWidth;
      if (!sw) return;
      const crtRect = crt.getBoundingClientRect();
      const viewRect = view.getBoundingClientRect();
      const footRect = foot.getBoundingClientRect();
      const above = Math.max(0, viewRect.top - crtRect.top);
      const below = Math.max(0, footRect.bottom - viewRect.bottom);
      const avail = Math.max(120, crtRect.height - above - below - 8);
      const scale = Math.min(sw / 320, avail / 180);
      const w = Math.floor(320 * scale);
      const h = Math.floor(180 * scale);
      if (Math.abs(view.clientWidth - w) > 1 || Math.abs(view.clientHeight - h) > 1) {
        view.style.width = w + "px";
        view.style.height = h + "px";
      }
    }

    let lastT = 0;
    function loop(now) {
      const dt = lastT ? Math.min(0.05, ((now || 0) - lastT) / 1000) : 0.016;
      lastT = now || 0;
      tick += 1;
      fitView();
      tickFP(dt);
      moveHero();
      if (ui.mode === "cab") tickCab(dt);
      if (ui.mode === "talk") ui.arrive = Math.min(1, (ui.arrive || 0) + 0.08);
      if (ui.mode === "act" && ui.act) {
        ui.act.t += 1;
        if (ui.act.t >= 72) endAct();
      }
      const scene = (ui.mode === "title" || ui.mode === "confirm") ? "title" : (ui.scene || state.location || "tasca");
      draw(scene);
      requestAnimationFrame(loop);
    }

    showTitle();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
