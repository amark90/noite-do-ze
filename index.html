    G.sheet = { who: prev.who, rows: prev.rows || [], fechado: true };
  });
}
function pushBoard(name, nights, wallet) {
  const who = cleanName(name);
  if (!who) return;
  const row = {
    name: who,
    nights: Math.max(1, Math.round(nights || 1)),
    wallet: Math.max(0, Math.round(wallet || 0)),
  };
  if (!window.TASCA_NOSAVE) saveWho(who);
  G.sheet = placeRow(shownBoard(), row);
  G.sheet.who = who;
  G.sheet.fechado = false;
  if (window.TASCA_NOSAVE) return;
  const seq = (G.boardSeq = (G.boardSeq || 0) + 1);
  fetch(QUADRO_URL + "/rest/v1/rpc/entra_no_quadro", {
    method: "POST",
    headers: quadroHeaders(),
    body: JSON.stringify({ p_nome: who, p_noites: row.nights, p_bolsa: row.wallet }),
  }).then((r) => (r.ok ? r.json() : Promise.reject())).then((data) => {
    if (G.boardSeq !== seq) return;
    G.sheet = { who: who, rows: rowsFrom(data), fechado: false };
  }).catch(() => {
    if (G.boardSeq !== seq) return;
    if (G.sheet) G.sheet.fechado = true;
  });
}
function boardBetter(a, b) {
  if (a.nights !== b.nights) return a.nights < b.nights;
  return a.wallet > b.wallet;
}
function placeRow(board, row) {
  const name = cleanName(row && row.name);
  const next = {
    name: name,
    nights: Math.max(1, Math.round((row && row.nights) || 1)),
    wallet: Math.max(0, Math.round((row && row.wallet) || 0)),
  };
  const base = { who: cleanName(board && board.who), rows: ((board && board.rows) || []).slice() };
  if (!name) return base;
  const prev = base.rows.find((r) => r.name === name);
  const keep = prev && !boardBetter(next, prev) ? prev : next;
  const rows = base.rows.filter((r) => r.name !== name);
  rows.push(keep);
  rows.sort((a, b) => a.nights - b.nights || b.wallet - a.wallet || a.name.localeCompare(b.name));
  return { who: base.who || name, rows: rows.slice(0, 10) };
}
function noteWin() {
  const nights = (G.report && G.report.night) || Math.max(1, G.night - 1);
  const who = (G.sheet && G.sheet.who) || loadWho();
  if (who) {
    pushBoard(who, nights, G.wallet);
    G.naming = false;
    G.mode = "quadro";
    return;
  }
  G.naming = true;
  G.nameBuf = "";
}
function commitName() {
  const name = cleanName(G.nameBuf);
  G.naming = false;
  G.nameBuf = "";
  if (!name) return;
  const nights = (G.report && G.report.night) || Math.max(1, G.night - 1);
  pushBoard(name, nights, G.wallet);
  G.mode = "quadro";
}

function warm() {

    const A = window.AudioContext || window.webkitAudioContext;

  } catch (e) {}
}
function tone(freq, dur, type, vol) {
  if (G.muted) return;
  try {
    warm();
    if (!AC) return;
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.04, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start();
    o.stop(AC.currentTime + dur);
  } catch (e) {}
}

function updateShift(dt) {
  if (G.guest) {
    if (G.mode === "bar") {
      G.guest.life -= dt;
      if (G.holding) {
        G.holdT += dt;
        const surge = 0.58 + 0.4 * (0.5 + 0.5 * Math.sin(G.holdT * 8.5));
        G.pour = Math.min(1, G.pour + dt * surge);
        G.tickS -= dt;
        if (G.tickS <= 0) {
          G.tickS = 0.18;
          tone(160 + G.pour * 480, 0.035, "sine", 0.018);
        }
      }
      if (G.guest.life <= 0) fleeGuest();
      else if (!G.holding) {
        G.guest.nagT -= dt;
        if (G.guest.nagT <= 0) {
          G.guest.nag += 1;
          G.guest.nagT = 1.45;
          G.guest.nagLine = G.guest.chat ? chatNag() : nagLine();
          bump("paciencia", G.guest.chat ? -1 : -3);
          bump("taberneiro", G.guest.chat ? 1 : 2);
        }
      }
    } else {
      G.guest.life -= dt * (G.guest.good ? 0.45 : 0.65);
      if (G.guest.life <= 0) {
        const good = G.guest.good;
        const chat = G.guest.chat;
        G.guest = null;
        G.pour = 0;
        G.holding = false;
        G.missed += 1;
        if (good) crackFail(good);
        else {
          G.toast = chat ? "A língua foi-se. Ficaste a falar sozinho." : "Foi-se. O copo ficou com sede.";
          G.toastT = 2;
        }
      }
    }
  }
  if (G.gap > 0) G.gap -= dt;
  if (!G.guest && G.gap <= 0 && G.nextArrival < ARRIVALS.length && G.elapsed >= ARRIVALS[G.nextArrival]) {
    if (G.mode === "bar") spawn();
    else {
      G.missed += 1;
      G.toast = "Veio gente, e o balcão estava sozinho.";
      G.toastT = 2;
    }
    G.nextArrival += 1;
  }
  if (G.phase === "idle" && G.elapsed >= 8 && (G.servedOnce || G.elapsed >= 12)) openDoor();
}

function updateStreet(dt) {

  let dir = 0;
  if (held.has("a") || held.has("arrowleft")) dir -= 1;
  if (held.has("d") || held.has("arrowright")) dir += 1;
  const moving = !!(dir || G.dest != null);
  if (moving) G.stride = Math.min(1, G.stride + dt * 3.4);
  else G.stride = Math.max(0, G.stride - dt * 6);
  const spd = 160 + 380 * G.stride;
  if (dir) {
    G.dest = null;
    G.face = dir;
    G.x += dir * spd * dt;
  } else if (G.dest != null) {
    const d = G.dest - G.x;
    if (Math.abs(d) < 8) G.dest = null;
    else {
      G.face = Math.sign(d);
      G.x += Math.sign(d) * Math.min(spd * dt, Math.abs(d));
    }
  }
  G.x = Math.max(70, Math.min(WORLD - 70, G.x));
  if (moving) {
    G.step += dt * (7 + 7 * G.stride);
    const stamp = Math.floor(G.step / Math.PI);
    if (stamp !== G.stamp && G.stride > 0.35) {
      G.stamp = stamp;
      G.puffs.push({ x: G.x - G.face * 16, y: 460, vx: -G.face * 36, t: 0.42, r: 4 });
    }
  }
  placeCamera(false);
  const glide = 1 - Math.exp(-8 * dt);
  G.cam += (G.camTo - G.cam) * glide;
  if (G.haul && G.haul.took && !G.haul.landed && Math.abs(G.x - doorX("tasca")) < 88) winHaul();
}

  ctx.fillStyle = "#140e0c";
  ctx.fillRect(0, 0, 960, 540);
  label("A abrir a tasca…", 480, 250, "28px " + SERIF, "#e4c27a", "center");
  ctx.fillStyle = "#3a2a22";
  ctx.fillRect(280, 290, 400, 10);
  ctx.fillStyle = "#e4c27a";
  ctx.fillRect(280, 290, 400 * (G.load || 0), 10);
}

function render() {
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  if (G.shake > 0 && G.mode === "bar") ctx.translate((Math.random() - 0.5) * 7, (Math.random() - 0.5) * 4);
  ctx.clearRect(-20, -20, 1000, 580);
  if (G.mode === "boot") drawBoot();
  else if (G.mode === "title") drawTitle();
  else if (G.mode === "quadro") drawQuadro();
  else if (G.mode === "card") drawCard();
  else if (G.mode === "street") { drawStreet(); vignette(); drawHud(); drawHaulGlass(); drawMeters(); drawToast(); drawFloats(); buttons(); }
  else if (G.mode === "stool") { drawStool(); vignette(); drawHud(); drawToast(); drawFloats(); buttons(); }
  else { drawBar(); vignette(); drawHud(); drawMeters(); drawToast(); drawFloats(); buttons(); }
}

let last = 0;
function loop(t) {
  let dt = last ? Math.min(0.05, (t - last) / 1000) : 0;
  last = t;
  if (document.hidden) dt = 0;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

function knockFringe(im) {
  return knockSheet(im, false);
}
function knockGlass(im) {
  return knockSheet(im, true);
}
function knockSheet(im, glass) {
  try {
    const c = document.createElement("canvas");
    c.width = im.naturalWidth || im.width;
    c.height = im.naturalHeight || im.height;
    const g = c.getContext("2d", { willReadFrequently: true });
    g.drawImage(im, 0, 0);
    const d = g.getImageData(0, 0, c.width, c.height);
    const p = d.data;
    for (let i = 0; i < p.length; i += 4) {
      const r = p[i], gc = p[i + 1], b = p[i + 2];
      if (r > 120 && b > 60 && gc < 55 && (r - gc) > 70 && (b - gc) > 40) { p[i + 3] = 0; continue; }
      if (glass && b > 70 && r > 90 && b > gc + 25 && r > gc + 15) {
        const v = Math.max(r, gc, b);
        p[i] = p[i + 1] = p[i + 2] = v;
      }
    }
    g.putImageData(d, 0, 0);
    return c;
  } catch (e) { return im; }
}
function boot() {
  loadLang();
  loadSave();
  const files = [];
  Object.keys(CAST).forEach((id) => files.push([id, CAST[id].src]));
  Object.keys(PROP).forEach((id) => files.push([id, PROP[id]]));
  PEEL.forEach((src, i) => files.push(["peel" + i, src]));
  files.push(["peelHead", "cast/peel-head.png"]);
  let left = files.length;
  const tick = () => {
    left -= 1;
    G.load = 1 - left / files.length;
    if (left <= 0) G.mode = "title";
  };
  files.forEach(([k, src]) => {
    const im = new Image();
    im.onload = () => { if (im.naturalWidth) IMG[k] = SOLID[k] ? im : (k === "copo" ? knockGlass(im) : (PROP[k] ? knockFringe(im) : im)); tick(); };
    im.onerror = tick;
    im.src = src;
  });
  const s = sdk();
  try {
    if (s.cg && s.cg.init) s.cg.init();
  } catch (e) {}
  try {
    if (s.poki && s.poki.init) {
      Promise.resolve(s.poki.init()).then(() => {
        try { if (s.poki.gameLoadingFinished) s.poki.gameLoadingFinished(); } catch (e) {}
      }, () => {});
    }
  } catch (e) {}
  requestAnimationFrame(loop);
}
boot();
</script>
