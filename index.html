let LANG = "pt";
function tr(s) {
  if (s == null || LANG !== "en") return s;
  return Object.prototype.hasOwnProperty.call(EN, s) ? EN[s] : s;
}
function tf(s, map) {
  let t = tr(s);
  Object.keys(map || {}).forEach((k) => { t = t.split("{" + k + "}").join(String(map[k])); });
  return t;
}
function applyLang() {
  document.documentElement.lang = LANG === "en" ? "en" : "pt";
  const d = document.querySelector('meta[name="description"]');
  if (d) d.setAttribute("content", LANG === "en"
    ? "Tasca do Abílio. Walk the street, pour in the tasca, pay Matos. One night at a time, in the browser."
    : "Tasca do Abílio. Anda a rua, serve na tasca, paga ao Matos. Uma noite de cada vez, no browser.");
}
function loadLang() {
  let v = "pt";
  try {
    const s = localStorage.getItem("tasca-lang");
    if (s === "en" || s === "pt") v = s;
    else v = (navigator.language || "").toLowerCase().indexOf("pt") === 0 ? "pt" : "en";
  } catch (e) {}
  LANG = v;
  applyLang();
}
function setLang(v) {
  if (v !== "pt" && v !== "en") return;
  LANG = v;
  try { localStorage.setItem("tasca-lang", v); } catch (e) {}

}

function check(cond) {
  if (!cond) return true;
  if (Array.isArray(cond)) return cond.every(check);
  if ("nao" in cond) return !check(cond.nao);
  if ("todos" in cond) return cond.todos.every(check);
  if ("algum" in cond) return cond.algum.some(check);
  if ("tem" in cond) {
    if (cond.tem === "faca") return !!G.knife;
    if (cond.tem === "carteira") return !G.semCarteira;
    return false;
  }
  if ("dinheiro" in cond) return G.wallet >= cond.dinheiro;
  if ("carry" in cond) return G.carry === cond.carry;
  if ("maoVazia" in cond) return !G.carry;
  if ("amigo" in cond) return !!G.zequinhaAmigo === !!cond.amigo;
  if ("semCarteira" in cond) return !!G.semCarteira === !!cond.semCarteira;
  if ("quiet" in cond) return !!G.quietNight === !!cond.quiet;
  if ("chance" in cond) return Math.random() < cond.chance;
  return false;
}
function resolve(route) {
  if (route == null) return "sair";
  if (typeof route === "string") return route;
  for (const b of route) {
    if (typeof b === "string") return b;
    if (check(b.se)) return resolve(b.ir);
  }
  return "sair";
}
function apply(effects) {
  if (!effects) return;
  if (effects.perderCarteira) {
    G.naCarteira = G.wallet;
    G.wallet = 0;
    G.semCarteira = true;
  }
  if (effects.recuperarCarteira) {
    G.wallet = G.naCarteira || 0;
    G.naCarteira = 0;
    G.semCarteira = false;
  }
  if (effects.dinheiro) G.wallet = Math.max(0, G.wallet + effects.dinheiro);
  if (effects.multa) {
    const falta = Math.max(0, effects.multa - G.wallet);
    G.wallet = Math.max(0, G.wallet - effects.multa);
    if (falta) G.debt += falta;
    if (G.debt > teto()) cobraTecto();
  }
  if (effects.deliver && G.carry === effects.deliver) {
    const pay = effects.pay || 0;
    G.rua += pay;
    G.wallet += pay;
    G.carry = "";
  }
  if (effects.carry) G.carry = effects.carry;
  if (effects.pontos) G.pontos += effects.pontos;
  if (effects.hora) G.hora += effects.hora;
  if (effects.amigo) G.zequinhaAmigo = true;
  if (effects.gastarAmigo) G.zequinhaAmigo = false;
  if (effects.faca) G.knife = true;
  if (effects.semFaca) G.knife = false;
  if (effects.casa) G.casaBeat = true;
  if (effects.fim) G.fim = effects.fim;
}

function tone(freq, dur, type, gain) {
  try {
    const c = ac();
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.value = gain || 0.05;
    o.connect(g); g.connect(c.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + dur);
    o.stop(c.currentTime + dur);
  } catch (e) {}
}
function noise(dur, freq, gain) {
  try {
    const c = ac();
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = c.createBufferSource();
    s.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.value = freq;
    const g = c.createGain();
    g.gain.value = gain || 0.18;
    s.connect(f); f.connect(g); g.connect(c.destination);
    s.start();
  } catch (e) {}
}

function stakeLine() {
  if (G.matosPago || G.nextQuiet) return "A próxima noite o Matos fica calado.";
  if (G.chapter >= 3 && G.debt <= 0) return CHAPTERS[3].line;
  const j = CHAPTERS[G.chapter].juros ? Math.max(10, Math.round(G.debt * 0.07)) : 0;
  if (!j) return CHAPTERS[G.chapter].line;
  return tf("Deves {debt} € ao homem. Esta noite ele tira {j}.", { debt: G.debt, j });
}
function drawTitle() {
  G.x = 420;
  G.y = 390;
  G.mode === "title" && drawStreet();
  G.ui = [];
  ctx.fillStyle = "rgba(8,6,6,0.45)";
  ctx.fillRect(0, 0, 960, 540);
  ctx.fillStyle = "#120e0c";
  ctx.strokeStyle = "#e4c27a";
  ctx.lineWidth = 2;
  roundRect(500, 36, 424, 470, 18);
  ctx.fill();
  ctx.stroke();
  label(tr(CHAPTERS[G.chapter].title).toUpperCase(), 712, 78, "14px " + SERIF, "#e4c27a", "center");
  label("TASCA", 712, 118, "26px " + SERIF, "#e4c27a", "center");
  label("do Abílio", 712, 176, "48px " + SERIF, "#f6efe2", "center");
  ctx.font = "15px " + SERIF;
  wrap(tr(stakeLine()), 360).slice(0, 3).forEach((ln, i) => label(ln, 712, 214 + i * 18, "15px " + SERIF, "#f6efe2", "center"));
  const note = !!G.titleNote;
  const goY = note ? 300 : 280;
  button(536, goY, 348, 48, tr("Abre a noite"), true, () => beginNight());
  if (G.seen) button(536, goY + 58, 348, 36, tr(G.arm ? "Mesmo? Ficas sem casa." : "Deitar abaixo"), false, () => {
    if (!G.arm) { G.arm = true; return; }
    resetGame();
    G.mode = "title";
    save();
  });
  button(536, note ? 430 : 400, 348, 28, tr("O quadro"), false, () => { G.mode = "quadro"; pullBoard(); });
  textBtn(560, note ? 470 : 448, tr("Português"), () => setLang("pt"));
  textBtn(700, note ? 470 : 448, "English", () => setLang("en"));
  if (note) wrap(tr(G.titleNote), 360).slice(0, 2).forEach((ln, i) => label(ln, 712, 268 + i * 16, "14px " + SERIF, "#e4c27a", "center"));
  else label(tr("A mão é que sabe. O verde paga."), 712, 500, "13px " + SERIF, "#c4a574", "center");
}
function drawCard() {
  if (G.mode !== "card") return;
  drawStreet();
  ctx.fillStyle = "rgba(8,6,6,0.9)";
  ctx.fillRect(0, 0, 960, 540);
  G.ui = [];
  ctx.fillStyle = "#140e0c";
  ctx.strokeStyle = "#e4c27a";
  ctx.lineWidth = 2;
  roundRect(150, 18, 660, 508, 16);
  ctx.fill();
  ctx.stroke();
  const r = G.report || { night: 1, copos: 0, rua: 0, juros: 0, net: 0, sobe: 0, kind: "amanheceu", title: "" };
  const end = ENDS[r.kind] || ENDS.amanheceu;
  label(tr(end.title).toUpperCase(), 480, 58, "28px " + SERIF, r.kind === "espancado" ? "#e07060" : "#e4c27a", "center");
  label(tr(end.line), 480, 84, "16px " + SERIF, "#f6efe2", "center");
  label((r.net > 0 ? "+" : "") + r.net + " €", 480, 140, "48px " + SERIF, r.net < 0 ? "#e07060" : "#e4c27a", "center");
  label(r.sobe > 0 ? tf("A dívida sobe {n} €", { n: r.sobe }) : tr("esta noite"), 480, 164, "15px " + SERIF, "#c4a574", "center");
  label(tr("Balcão"), 300, 200, "14px " + SERIF, "#c4a574", "center");
  label(r.copos + " €", 300, 226, "24px " + SERIF, "#f6efe2", "center");
  label(tr("Recados"), 480, 200, "14px " + SERIF, "#c4a574", "center");
  label(r.rua + " €", 480, 226, "24px " + SERIF, "#f6efe2", "center");
  label(tr("Matos"), 660, 200, "14px " + SERIF, "#c4a574", "center");
  label(r.juros + " €", 660, 226, "24px " + SERIF, "#f6efe2", "center");
  label(tf("No bolso {n} €", { n: G.wallet }), 330, 268, "18px " + SERIF, "#f6efe2", "center");
  label(tf("Deves {n} €", { n: G.debt }), 630, 268, "18px " + SERIF, "#f6efe2", "center");
  label(tr(rank(G.pontos)), 480, 304, "22px " + SERIF, "#7ee0ff", "center");
  let extra = G.banner ? tr(G.banner) : "";
  if (G.naming) {
    label(tr("Como te tratam no balcão?"), 480, 348, "18px " + SERIF, "#f6efe2", "center");
    label((G.nameBuf || "") + "▌", 480, 384, "28px " + SERIF, "#e4c27a", "center");
    button(280, 430, 400, 48, tr("Fica escrito."), true, commitName);
    return;
  }
  if (extra) {
    ctx.font = "15px " + SERIF;
    wrap(extra, 560).slice(0, 2).forEach((ln, i) => label(ln, 480, 336 + i * 18, "15px " + SERIF, "#e4c27a", "center"));
  }
  const canPay = G.wallet > 0 && G.debt > 0;
  if (canPay) button(170, 390, 250, 44, tr("Pagar ao Matos"), false, payDebt);
  if (supportUrl() && !G.quietNight) button(canPay ? 450 : 280, 390, 320, 44, tr("Cala o Matos · 2 €"), false, buyMatos);
  button(280, 454, 400, 48, tr(G.shut ? "Ficou assim." : "Outra, vá"), true, another);
}
function drawQuadro() {
  drawStreet();
  ctx.fillStyle = "rgba(8,6,6,0.9)";
  ctx.fillRect(0, 0, 960, 540);
  G.ui = [];
  ctx.fillStyle = "#140e0c";
  ctx.strokeStyle = "#e4c27a";
  ctx.lineWidth = 2;
  roundRect(180, 28, 600, 484, 16);
  ctx.fill();
  ctx.stroke();
  label(tr("Quem fechou a casa."), 480, 72, "22px " + SERIF, "#e4c27a", "center");
  const rows = shownBoard().rows || [];
  if (!rows.length) {
    label(tr(G.sheet && G.sheet.fechado ? "O livro não abre." : "Ainda não há nome na casa."), 480, 248, "18px " + SERIF, "#f6efe2", "center");
    label(tr("O nome escreve-se quando a casa for tua."), 480, 280, "16px " + SERIF, "#e4c27a", "center");
  } else {
    rows.forEach((row, i) => {
      const y = 120 + i * 32;
      label(String(i + 1), 220, y, "16px " + SERIF, "#c4a574", "left");
      label(row.name, 250, y, "18px " + SERIF, "#f6efe2", "left");
      label(row.nights + " · " + row.wallet + " €", 720, y, "16px " + SERIF, "#e4c27a", "right");
    });
  }
  button(280, 456, 400, 44, tr("Volta."), true, () => { G.mode = "title"; });
}
function button(x, y, w, h, text, hot, fn) {
  ctx.fillStyle = hot ? "#e4c27a" : "#241812";
  ctx.strokeStyle = "#e4c27a";
  ctx.lineWidth = 2;
  roundRect(x, y, w, h, 10);
  ctx.fill();
  ctx.stroke();
  label(text, x + w / 2, y + h / 2 + 6, "18px " + SERIF, hot ? "#241812" : "#f6efe2", "center");
  G.ui.push({ x, y, w, h, fn });
}
function textBtn(x, y, text, fn) {
  label(text, x, y, "15px " + SERIF, "#f6efe2", "left");
  G.ui.push({ x: x - 4, y: y - 16, w: 110, h: 24, fn });
}
function render() {
  G.fineT = Math.max(0, (G.fineT || 0) - 0);
  ctx.setTransform(2, 0, 0, 2, 0, 0);
  ctx.clearRect(0, 0, 960, 540);
  if (G.mode === "title") drawTitle();
  else if (G.mode === "quadro") drawQuadro();
  else if (G.mode === "card") drawCard();
  else if (G.mode === "tasca") drawTasca();
  else if (G.mode === "casa") drawCasa();
  else drawStreet();
}
let last = 0;
function frame(t) {
  const dt = Math.min(0.05, last ? (t - last) / 1000 : 0.016);
  last = t;
  if (!window.__PAUSE && !document.hidden) {
    if (G.toastT > 0) G.toastT -= dt;
    if (G.fineT > 0) G.fineT -= dt;
    if (G.mode === "rua") updateRua(dt);
    else if (G.mode === "tasca") updateTasca(dt);
    else if (G.mode === "casa") updateCasa(dt);
  }
  render();
  requestAnimationFrame(frame);
}
canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); onDown(e); });
addEventListener("pointerup", onUp);
addEventListener("keydown", (e) => { keys.add(e.key.toLowerCase()); onKey(e); });
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => { keys.clear(); if (G.holding) releasePour(); });
loadLang();
loadSave();
canvas.focus();
requestAnimationFrame(frame);
</script>
</body>
